# Client auth for Docker Postgres — listen on all interfaces; require password (scram-sha-256) for remote TCP.
# Local sockets / loopback: trust (healthcheck, docker exec).
# TYPE  DATABASE  USER  ADDRESS       METHOD
local   all       all                 trust
host    all       all   127.0.0.1/32  trust
host    all       all   ::1/128       trust
host    all       all   0.0.0.0/0     scram-sha-256
host    all       all   ::/0          scram-sha-256
