# SSH Key Access Configuration
# This file documents the policy for root-only, key-only SSH access.

# Server settings (~/.ssh/config Host "vpn" → 104.128.131.166)
SSH_HOST="vpn"
SSH_USER="root"
SSH_PORT="22"

# Emergency access
EMERGENCY_KEY_PATH="/root/.ssh/emergency_key"
BACKUP_DIR="/root/backup-ssh"

# Firewall expectations
FIREWALL_ENABLED="true"
ALLOW_HTTP="true"
ALLOW_HTTPS="true"

# Security controls
ENFORCE_ROOT_ONLY="true"
DISABLE_PASSWORD_AUTH="true"
USE_PUBKEY_ONLY="true"

# Logging
LOG_FILE="/var/log/ssh-key-policy.log"

# Backup retention
AUTO_BACKUP_CONFIG="true"
BACKUP_RETENTION_DAYS="30"

# Testing toggles
TEST_MODE="false"
DRY_RUN="false"