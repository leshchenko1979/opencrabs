storage:
  type: sqlite
  path: /data/gatus.db

web:
  port: 8080

alerting:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
    id: ${TELEGRAM_CHAT_ID}
  custom:
    url: "http://172.18.0.1:9081/gatus/alert"
    method: POST
    headers:
      X-Gatus-Secret: ${GATUS_BRIDGE_SECRET}
    body: |
      {"endpoint":"[ENDPOINT_NAME]","status":"[ALERT_TRIGGERED_OR_RESOLVED]","conditions":"[RESULT_CONDITIONS]","errors":"[RESULT_ERRORS]"}

external-endpoints:
  - name: sender
    group: messaging
    token: ${SENDER_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: telegram
        enabled: true
        failure-threshold: 1

  - name: business-tinder-notifications
    group: messaging
    token: ${BUSINESS_TINDER_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: telegram
        enabled: true
        failure-threshold: 1

endpoints:
  - name: ai-antispam
    group: always-on
    url: "https://ai-antispam.l1979.ru/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 1
        send-on-resolved: true

  - name: ai-gateway
    group: always-on
    url: "https://ai-gateway.l1979.ru/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 1
        send-on-resolved: true

  - name: business-tinder
