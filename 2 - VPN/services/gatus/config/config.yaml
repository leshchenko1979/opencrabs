storage:
  type: sqlite
  path: /data/gatus.db

web:
  port: 8080

alerting:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
    id: ${TELEGRAM_CHAT_ID}
  custom:
    url: "http://172.18.0.1:18791/a2a/v1"
    method: POST
    headers:
      Content-Type: "application/json"
    body: '{"jsonrpc":"2.0","id":1,"method":"message/send","params":{"message":{"role":"user","parts":[{"text":"[Gatus] [ENDPOINT_NAME] TRIGGERED\nFollow AGENTS.md [Gatus] alerts (load_brain_file AGENTS.md + MEMORY.md if not loaded)."}]}}}'

external-endpoints:
  - name: sender
    group: apps
    token: ${GATUS_EXTERNAL_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: telegram
        enabled: true
        failure-threshold: 1

  - name: business-tinder-notifications
    group: apps
    token: ${GATUS_EXTERNAL_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: telegram
        enabled: true
        failure-threshold: 1

  - name: mac-backup
    group: infra
    token: ${GATUS_EXTERNAL_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: telegram
        enabled: true
        failure-threshold: 3

endpoints:
  - name: ai-antispam
    group: apps
    url: "https://ai-antispam.l1979.ru/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 1
        send-on-resolved: true

  - name: ai-gateway
    group: apps
    url: "https://ai-gateway.l1979.ru/health"
    interval: 60s
