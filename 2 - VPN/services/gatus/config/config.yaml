  - name: redevest-crm
    group: sablier
    url: "https://redevest-crm.ru/health"
    interval: 3h
    client:
      timeout: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 60000"
    alerts:
      - type: telegram
        failure-threshold: 1
        success-threshold: 1
