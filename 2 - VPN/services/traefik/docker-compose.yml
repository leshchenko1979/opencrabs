services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command: --configfile=/config/config.yml
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/config
    environment:
      - TZ=Europe/Moscow

networks:
  default:
    name: traefik-public
