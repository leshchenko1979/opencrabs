name: CI lane impl

# CI lane impl — the SINGLE `workflow_call` body behind BOTH carrier lanes.
#
# NO SCCACHE (2026-11-21, cache-budget measurement). `mozilla-actions/
# sccache-action` was removed from BOTH jobs that had it (linux-amd64, lint).
# Why, measured on this repo's own cache inventory: 2394 sccache entries held
# 1194 MB of a 8801 MB budget (85.9% of the 10240 MB repo cap) while 2209 of
# them (92.3%) were ZERO bytes — 99.7% of all cache ENTRIES for 13.6% of the
# size. Each 0-byte entry is a cache slot spent on a key that never produced an
# object, and near the cap GitHub evicts by LRU across the whole repo, so the
# multi-GB rust-cache entries (nextest 4437 MB, lint 2369 MB, linux-amd64 801 MB)
# were competing with 2394 husks. The compile legs already restore a
# `Swatinem/rust-cache` target directory, which is what actually makes a
# re-run cheap; sccache was a second, thinner cache over the same work.
# Removed: the two action steps, both `RUSTC_WRAPPER: "sccache"` envs, and the
# `sccache --show-stats` lines in both `diagnose` probes (they would print
# "(sccache not on PATH)" forever). pr-gates-nextest never had it — see the
# note on that job.
#
# This file carries no `on: workflow_dispatch`. It is called by two thin shells
# that keep their own names, triggers and inputs:
#   * quick-build-linux.yml — sends `mode: build` (ORDER gates -> Linux amd64)
#   * pr-checks.yml         — sends `mode: gate`  (PR-lane gates)
# Filenames of both shells do NOT change; that is the point of this option.
#
# WHY `mode` AND NOTHING FINER: a `workflow_call` workflow cannot see which file
# called it, so exactly one new selector is required, and it selects the JOB
# FAMILY only. The step legs stay on the existing booleans (fix / lockregen /
# swap / fast / diagnose), whose `if:` expressions move here verbatim. Folding
# those five into `mode` would re-encode working expressions as churn with no
# buyer. `mode` is `required: true` so a call with no family selected fails
# loudly instead of silently defaulting into a leg.
#
# BODIES ARE ALREADY CALL-CLEAN: the legacy event-inputs context returns 0 hits
# in both source files; every input read already uses the `inputs.` context form that
# `workflow_call` populates. The bodies therefore move WITHOUT a single
# reference rewrite — this was the largest structural risk of the option, and it
# was measured rather than assumed.
#
# A second workflow was rejected: it would duplicate the whole gate body and
# fork the cargo flags that every dispatch of this lane must carry identically.
# No external document pins them — THIS FILE is the authority for them, and the
# `ci/*` carrier namespace is owned by the HQ lane.
#
# TOOLCHAIN DECISION (implementation step 4): the Rust install step is resolved
# ONCE here for both families, in the `dtolnay/rust-toolchain@master` form with
# an explicit `toolchain: 1.100.0` — NOT `@stable`, and not a bare
# `rust-toolchain.toml` read. Why: `@stable` always resolves the latest stable
# and would IGNORE a future version pin added to the tree, so a pin could never
# take effect; the `@master` + explicit `toolchain:` form is what pr-checks.yml
# already used, so the gate lane's toolchain is byte-identical and the build
# lane converges onto it rather than the other way round. `components:` is
# requested only where something actually runs them: `lint` executes clippy
# and needs that component; `pr-gates-nextest` runs neither rustfmt nor clippy
# and installs the bare toolchain. `linux-amd64` runs neither either — its
# `components:` line is kept as a known wart (the download is small beside the
# build) rather than changed in the same commit that re-sizes the cache keys.
#
# PINNED 2026-11-20 (owner order): `stable` -> `1.100.0` at all three install
# sites. The local sanctioned `rustfmt` is pinned to Rust 1.100.0 / commit
# `0ef1bc3860` (owner order 2026-11-19), and `editor.md §Box law` states that
# local and CI formatting "agree byte-for-byte" — which held only while
# `stable` happened to resolve to 1.100.0. A floating `stable` silently
# falsifies that the day a new release lands, turning a local `oc-fmt --check`
# clean into a false clean against the gate. Advancing this pin means bumping
# BOTH this file and the `/opt/rustfmt-*` install in the same change.
# COST, stated because it is real: the pin moves the `Swatinem/rust-cache` key,
# so the first run after it is a COLD build — the exact condition behind the
# 45-minute cap stalls. State of the bounding machinery after the 2026-11-20
# deletion of the legacy `cargo test` leg: the four 45-minute JOB caps are
# unchanged and still in place; the STALLWATCH watchdog did NOT go out with that
# leg, it was re-homed into `pr-gates-nextest` (flat-CPU / no-progress / log-
# silence predicates, plus nextest's own per-test slow-timeout). The `linux-amd64` job
# is the one that remains UNINSTRUMENTED: it has a job cap and nothing that can
# tell a slow build from a wedged one.
#
# DISPATCH CONSTRAINT (implementation step 5, settled from the GitHub docs, not
# from an untested path): "To trigger the `workflow_dispatch` event, your
# workflow must be in the default branch", with `--ref` as the documented escape
# — "To run a workflow on a branch other than the repository's default branch,
# use the `--ref` flag." Neither shell is on `main`, so EVERY dispatch of either
# shell must carry `--ref ci/quick-build-linux`. A bare `gh workflow run <name>`
# is NOT a supported form for these files and must not be introduced into any
# tool or doc. Both sanctioned tools already pass `--ref` — which is precisely
# why this option leaves them working.
#
# `concurrency:` and `permissions:` deliberately stay on the SHELLS, unchanged.
# `oc-ship-audit` and `run_built_sha` key off `.jobs[].name`, so every job name
# below travels VERBATIM from its source file, and each caller job's `name:` is
# pinned to a short prefix-safe token (`ship` / `gate`) so the caller's own name
# can never be the first decodable match.

on:
  workflow_call:
    inputs:
      mode:
        description: "Job family: 'build' = ORDER gates then Linux amd64 build (quick-build-linux.yml); 'gate' = PR-lane gates (pr-checks.yml)"
        required: true
        type: string
      ref:
        description: "Branch or full sha to gate (the PR-head branch, e.g. leshchenko1979/<slug>)"
        required: false
        default: main
        type: string
      fix:
        description: "true = run cargo fmt --all and upload the diff as the fmt-fix artifact instead of gating"
        required: false
        default: false
        type: boolean
      lockregen:
        description: "true = cargo metadata minimal re-resolve with the existing Cargo.lock; uploads the regenerated lock as the regen-lock artifact instead of gating"
        required: false
        default: false
        type: boolean
      lockupdate:
        description: "true = cargo update (newest semver-compatible for every package) with the existing Cargo.lock; uploads the updated lock as the updated-lock artifact instead of gating"
        required: false
        default: false
        type: boolean
      lock_pins:
        description: "lockupdate only: space-separated pkg@version pins applied AFTER cargo update (e.g. 'glass_pumpkin@2.0.0-rc0'). Holds a crate whose newest version satisfies a dependent's caret requirement but breaks its code — the prerelease-caret trap. Requirements are never rewritten."
        required: false
        default: ""
        type: string
      swap:
        description: "true = swap prep: mirror build-leg gate 4 (Session-Id trailer) on the gated ref before the gates; swap-mode GREEN means swappable"
        required: false
        default: false
        type: boolean
      fast:
        description: "true = fast gate (fmt + clippy only, skip tests); for quick syntax and lint checks"
        required: false
        default: false
        type: boolean
      # INERT HERE, DELIBERATELY: `no_cancel` is consumed by each SHELL's own
      # `concurrency.cancel-in-progress` expression (which stays on the shell),
      # never by a step below — verified 0 references. It is declared so the
      # contract carries all ten existing inputs verbatim and no caller's
      # `with:` mapping can name a key the callee does not accept.
      no_cancel:
        description: "true = never cancel an in-flight run on this ref (immutable-sha gates: merge cutover + swap mode)"
        required: false
        default: false
        type: boolean
      diagnose:
        description: "true = print the runner's real resource envelope (cpu/ram/disk/cgroup) after the lint/compile legs; diagnostic only, never fails the run"
        required: false
        default: false
        type: boolean
      # NO `test_threads` / `hangdump` HERE (deleted 2026-11-22): 0 references
      # in this file. They stay declared on the pr-checks.yml shell, the surface
      # a dispatch names — see that file's header for the counts.
      source_repository:
        description: "Repository to check out (owner/name)"
        required: false
        default: adolfousier/opencrabs
        type: string
      source_ref:
        description: "Git ref to build (branch/tag/sha)"
        required: false
        default: main
        type: string
      features:
        description: "Cargo feature set passed to --features (comma-separated). EMPTY = resolve the shipped set from quick-build-linux.yml, its single source of truth."
        required: false
        # DELIBERATELY EMPTY (2026-11-22): the default used to be a second copy
        # of quick-build-linux.yml's set, and two copies drift. The gate
        # resolves it from that file at run time instead. Change it THERE.
        default: ""
        type: string
      # BINARY IDENTITY (#865). The fork republishes on an UNCHANGED upstream
      # version (`0.5.4+fork.430` -> `0.5.4+fork.431`), so the compiled-in
      # version is the only way a running binary can say which deploy cycle it
      # is. Empty (the default, and every PR-lane gate call) leaves
      # `OPENCRABS_FORK_VERSION` unset-equivalent: src/lib.rs then reports
      # CARGO_PKG_VERSION exactly as before, so upstream CI and contributor
      # builds are unchanged.
      fork_version:
        description: "Version the binary reports, `<upstream-ver>+fork.<cycle>` (empty = plain CARGO_PKG_VERSION)"
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # THE PIN, MADE AUTHORITATIVE (2026-11-20). Every job below installs 1.100.0
  # via `dtolnay/rust-toolchain@master` + `toolchain: 1.100.0`, and that action
  # finishes with `rustup default 1.100.0` -- which the tree's
  # `rust-toolchain.toml` (`channel = "stable"`) then OVERRIDES. CI's own log
  # says it verbatim (run 44779316077):
  #   "info: note that the toolchain 'stable-x86_64-unknown-linux-gnu' is
  #    currently in use (overridden by
  #    '/home/runner/work/opencrabs/opencrabs/rust-toolchain.toml')"
  # So 1.100.0 was installed and then ignored, and every gate compiled on
  # whatever `stable` the runner image happened to ship -- precisely the drift
  # the pin exists to stop, including rustfmt divergence from the box's pinned
  # /opt/rustfmt-1.100.0 (byte-identical formatting is only guaranteed when
  # both sides run the same release).
  # rustup precedence is: +arg > RUSTUP_TOOLCHAIN > directory override >
  # rust-toolchain.toml > default. `RUSTUP_TOOLCHAIN` is therefore the ONLY
  # lever above the tree's own file, and it pins the fmt, clippy, build and
  # nextest jobs at once instead of patching four action invocations.
  # Do NOT "fix" this by editing rust-toolchain.toml to 1.100.0: that file is
  # upstream's and the sync force-pushes over it.
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  # ------------------------------------------------------------------ gates --
  # ORDER gates x4 — pure git/sha verification (test leg removed 2026-08-31,
  # owner word: duplication of the PR-gate test deleted, not optimized).
  # Gate 4 checks the Session-Id trailer SHAPE only — the workers ledger lives
  # on the ops box and GitHub never sees it (design ruling); ledger-membership
  # is verified box-side by oc-order-validate pre-dispatch. Defense in depth.
  #
  # These four gates stay a JOB, not steps of `linux-amd64`: today they are separate
  # jobs with the build gated on `needs:`, and flattening them would move the
  # failure surface the ship lane reports on. The name travels verbatim, so
  # `oc-ship-audit`'s `contains($sha) and not contains("ORDER gates")`
  # predicate stays satisfied.
  order-gates:
    if: ${{ inputs.mode == 'build' }}
    name: ORDER gates (${{ inputs.source_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate 1 SHAPE — source_ref is a FULL 40-hex sha
        run: |
          echo "${{ inputs.source_ref }}" | grep -Eq '^[0-9a-fA-F]{40}$' \
            || { echo "GATE SHAPE FAIL: source_ref must be a full 40-hex sha (short form makes actions/checkout fetch a literal '<sha>*' branch): '${{ inputs.source_ref }}'"; exit 1; }

      - name: Sync from origin (ordered sha)
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Gate 2 EXISTENCE — sha is a real commit
        run: git rev-parse --verify "${{ inputs.source_ref }}^{commit}" >/dev/null

      - name: Gate 3 CONTAINMENT — sha is an ancestor of source repo main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${{ inputs.source_ref }}" refs/remotes/origin/main \
            || { echo "GATE CONTAINMENT FAIL: ${{ inputs.source_ref }} not contained in main tip $(git rev-parse refs/remotes/origin/main)"; exit 1; }

      - name: Gate 4 SIGNATURE — Session-Id trailer present
        run: |
          git log -1 --format=%B "${{ inputs.source_ref }}" | grep -Eq '^Session-Id:[[:space:]]*[0-9a-fA-F-]{36}' \
            || { echo "GATE SIGNATURE FAIL: no Session-Id trailer on ${{ inputs.source_ref }} (attribution mandatory)"; exit 1; }

  # JOB ID `linux-amd64` (2026-11-22, was `build`). The DISPLAY name below is
  # untouched: external tools parse it. `shared-key: build` on the cache step
  # keeps the `v0-rust-build-…` key, so the rename orphans no warm entry (the
  # one it owns is 801 MB; inventory 2026-11-22: 10 entries / 9744 MB of 10240).
  linux-amd64:
    if: ${{ inputs.mode == 'build' }}
    needs: order-gates
    name: Linux amd64 (${{ inputs.source_ref }}, ${{ inputs.features }})
    # PINNED, never `ubuntu-latest`. This artifact RUNS on the ops host
    # (Ubuntu 24.04, glibc 2.39), so it must be BUILT against a glibc that host
    # can satisfy. `ubuntu-latest` rolled forward between 2026-10-29 and
    # 2026-11-05: the 2026-11-05 artifact (run 42041612450) demanded
    # GLIBC_2.43, the host's loader refused it ("libm.so.6: version
    # `GLIBC_2.43' not found"), opencrabs-ops restart-looped, and oc-deploy
    # correctly rolled the swap back (journal swap-f84a7f99-…, seq 8
    # post-verify exit 1). Pin the OLDEST image we support; bump it only when
    # the host itself moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Sync from origin
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}

      - name: Install system deps (alsa for local-stt/local-tts, mold+clang for fast link)
        run: sudo apt-get update -y && sudo apt-get install -y pkg-config libasound2-dev mold clang

      # Toolchain resolved in ONE place — see the TOOLCHAIN DECISION note in the
      # file header. `@master` + an explicit `toolchain:` honours a future
      # version pin that `@stable` would ignore.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Pins the pre-rename job-id key: rust-cache keys on the JOB ID, so
          # without this the 801 MB warm entry is orphaned and ship compiles cold.
          shared-key: build

      - name: "Guard: feature set is non-empty (single source: quick-build-linux.yml)"
        # The callee's `features` default is empty on purpose (no second copy of
        # the shipped set); this family receives the value from the shell's own
        # dispatch default, so an empty one means someone dispatched
        # `-f features=` explicitly. Fail here rather than run
        # `cargo build --features ""` and ship a binary with no channels.
        # Via env, never interpolated into the run block (file header rule).
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          [ -n "$FEATURES" ] \
            || { echo "FEATURE SET EMPTY: pass -f features=<set>, or omit it to take the default declared in .github/workflows/quick-build-linux.yml (the single source of truth)"; exit 1; }

      - name: Build ([profile.ci], no tests)
        # Sized against THIS step, never the job wall: six consecutive green
        # runs measured 7.0/8.5/18.8/9.4/15.8/7.2 min (max 18.8m), so 35m is
        # 1.86x the max and still leaves the 45m job cap ~8 min of slack.
        timeout-minutes: 35
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          # Compile-time identity (#865). Empty is handled in src/lib.rs as
          # "unset", so a gate call (fork_version default "") still builds the
          # plain upstream version.
          OPENCRABS_FORK_VERSION: ${{ inputs.fork_version }}
          # inputs.* is never interpolated INSIDE a run: block (file header rule);
          # it reaches the shell as an env var, so it cannot inject syntax.
          FEATURES: ${{ inputs.features }}
        run: cargo build --locked --profile ci --no-default-features --features "$FEATURES"

      # No `strip` step here: `[profile.ci]` inherits `[profile.release]`, whose
      # `strip = true` (Cargo.toml on the gated tree) cargo already applies to
      # the artifact this step produces. A second `strip target/ci/opencrabs`
      # only re-stripped an already-stripped binary.

      # Provenance rider (v0.4.17): what produced this binary travels with
      # it — the IDENTITY chain records flags, not just shas.
      - name: Record build provenance
        run: |
          {
            echo "source_repository=${{ inputs.source_repository }}"
            echo "source_ref=${{ inputs.source_ref }}"
            echo "features=${{ inputs.features }}"
            echo "cargo_profile=ci"
            echo "lto=thin codegen_units=16"
            rustc -vV | grep -E '^(host|release):'
          } > build-flags.txt

      # Loader check: 2 seconds, and it is the step that would have caught the
      # 2026-11-05 GLIBC_2.43 incident (documented at the toolchain pin above)
      # before the artifact was uploaded and a swap consumed it. A bare
      # `--version` — not `--help` — because the dynamic loader must actually
      # map and relocate the binary for it to print anything.
      - name: Smoke the artifact (loader check)
        run: ./target/ci/opencrabs --version

      # Binary filename stays `opencrabs-linux-amd64` (swap scripts
      # depend on it); only the ARTIFACT name carries the set.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-linux-amd64-${{ inputs.features }}
          path: |
            target/ci/opencrabs
            build-flags.txt
          if-no-files-found: error

  # --------------------------------------------------------------- PR gates --
  # The PR-lane gate body, moved here from pr-checks.yml. `mode: gate` runs this
  # job FAMILY — `lint` (clippy, fmt-fix, the lock modes) plus
  # `pr-gates-nextest` (the blocking test verdict, further gated off in
  # fix/lockregen/lockupdate/fast); the build family is gated off by `if:`.
  # SHIPPED-FEATURE SPLIT (HQ 2026-11-19; owner order "gate and split").
  # This leg used to pass --all-features, so it compiled and tested whatsapp,
  # discord, slack, pdfium, local-stt/-tts and telegram-userbot: roughly 450
  # tests, about 4% of the suite, plus the rwhisper / serenity / slack-morphism /
  # pdfium-render dependency trees, for a binary that carries NONE of them
  # (the build leg has always been --no-default-features --features
  # telegram,code-graph,browser; `eval` JOINED the set 2026-11-20 by owner
  # order — it is an empty feature (`eval = []` in Cargo.toml), so it adds no
  # crates and no dependency tree, and this comment's history above stays
  # true of the set as it stood before that date). The blocking verdict must
  # answer "does the
  # thing we SHIP work", so this leg now mirrors the build leg exactly and the
  # --all-features coverage: COMPILE coverage stays (Clippy below runs
  # `--all-features`), but all-features TEST EXECUTION was DELETED 2026-11-20 by
  # owner order ("get rid of the all-features job"). Consequence, stated plainly:
  # the ~450 tests behind whatsapp/discord/slack/pdfium/local-stt/-tts no longer
  # run anywhere in the gate. A broken `#[cfg(feature = "whatsapp")]` module
  # still fails (Clippy compiles it); a broken TEST in one does not.
  # Source prerequisite: the 38 test modules that import a
  # non-shipped channel now carry their own #[cfg(feature)] gates in
  # src/tests/mod.rs, so this leg can compile at all.
  # Revert = re-add an all-features job; do not restore --all-features HERE.
  # JOB ID `lint` (2026-11-22, was `pr-gates`, which collided with the
  # `pr-gates-nextest` prefix). The DISPLAY name below is untouched and MUST
  # stay so: it embeds the gated ref and the mode suffix, and tools parse it.
  lint:
    if: ${{ inputs.mode == 'gate' }}
    name: PR-lane gates (${{ inputs.ref }}${{ inputs.fix && ' — FIX MODE' || inputs.lockregen && ' — LOCK REGEN' || inputs.lockupdate && ' — LOCK UPDATE' || inputs.swap && ' — SWAP MODE' || inputs.fast && ' — FAST' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: "Guard: lock_pins requires lockupdate"
        # `lock_pins` is read only inside the lock-update step, so pins passed in
        # any other mode are silently dropped — the pins you think you applied
        # and did not. False-green class; fail loudly instead.
        env:
          PINS: ${{ inputs.lock_pins }}
          LU: ${{ inputs.lockupdate }}
        run: |
          if [ -n "$PINS" ] && [ "$LU" != "true" ]; then
            echo "::error::lock_pins was set but lockupdate is not true — the pins would be silently ignored; re-dispatch with -f lockupdate=true"
            exit 1
          fi

      - name: Gate 4 mirror — Session-Id trailer on the gated ref (swap mode)
        if: ${{ inputs.swap && !inputs.fix && !inputs.lockregen && !inputs.lockupdate }}
        # Mirrors quick-build-linux.yml ORDER gate 4 EXACTLY (same regex), so
        # a swap-mode RED here equals the build-leg refusal — caught minutes
        # earlier, before a wasted build dispatch.
        run: |
          git log -1 --format=%B "${{ inputs.ref }}" | grep -Eq '^Session-Id:[[:space:]]*[0-9a-fA-F-]{36}' \
            || { echo "GATE 4 MIRROR FAIL: no Session-Id trailer on ${{ inputs.ref }} (swap heads must be trailer-signed; for merge heads land an empty trailer-signed marker commit — fleet-directives 2026-09-03)"; exit 1; }

      # Toolchain resolved in ONE place — see the TOOLCHAIN DECISION note in the
      # file header. This is the form pr-checks.yml already used, unchanged.
      - name: Install Rust (pinned 1.100.0, see TOOLCHAIN DECISION)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        # Fix mode builds a patch, not a verdict — restoring a multi-GB cache
        # to do it is pure setup cost.
        if: ${{ !inputs.fix }}
        with:
          cache-on-failure: true
          save-if: true # pre-PR branches re-run on fix-forward; warm cache turns the second dispatch into minutes
          # Pins the pre-rename job-id key (rust-cache keys on the JOB ID), so
          # the five warm `v0-rust-pr-gates-*` entries holding 3934 MB are not
          # orphaned. Inventory 2026-11-22.
          shared-key: pr-gates

      - name: Install system deps (pkg-config, ALSA dev, clang)
        if: ${{ !inputs.fix && !inputs.lockregen && !inputs.lockupdate }}
        # libasound2-dev is what local-stt/local-tts need (cpal -> alsa-sys),
        # and pkg-config is what alsa-sys needs to compile at all (carrier
        # lesson, 378a68a8). No fast linker: this job runs Clippy, which
        # emits metadata and never links, so one would be dead weight. clang
        # stays — a build script may invoke cc/clang for a C dependency, and
        # that is not visible from this file.
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libasound2-dev clang

      - name: Check formatting
        # RE-ARMED 2026-11-21 (factory #123). The step that used to live here
        # ran with `continue-on-error: true` under an upstream-mirroring
        # rationale, so it reported `success` on 520 hunks across 206 files —
        # a gate that hid its own breakage, worse than no gate at all. That is
        # why it was deleted on 2026-11-20 rather than trusted.
        #
        # The re-arm condition it named is now met: the sweep landed on main as
        # 50c820772 (203 files, 2211+/1311-), produced by this workflow's own
        # `fix` mode rather than a local toolchain (box law), and the PR-lane
        # gates AND the blocking nextest verdict were green on the swept tree
        # (run 44868067092). A `fix: true` dispatch against main afterwards
        # returns a 0-byte patch — the drift is gone, not merely hidden.
        #
        # NO `continue-on-error`. This step MUST be able to fail the run; that
        # is the entire point of re-arming it.
        if: ${{ !inputs.fix && !inputs.lockregen && !inputs.lockupdate }}
        run: cargo fmt --all -- --check

      - name: Clippy
        # Sized against THIS step: six consecutive green runs measured
        # 2.4/2.0/6.1/2.4/9.4/10.9 min (max 10.9m), so 25m is 2.29x the max.
        timeout-minutes: 25
        if: ${{ !inputs.fix && !inputs.lockregen && !inputs.lockupdate }}
        # `--benches` (2026-11-21, factory #125): the tree declares two
        # `harness = false` bench targets (src/benches/{database,memory}.rs) and
        # NOTHING else on this gate compiles them -- nextest runs libtest
        # binaries only and doctests are rustdoc's. Unselected, they rot green.
        # `--all-targets` would also cover them but widens the selector to
        # examples, which this gate does not lint; `--benches` is the minimal
        # truthful fix. Two more compile units: watch the first run's wall.
        env:
          # Same env VOCABULARY as the nextest job's STALLWATCH (one name, one
          # meaning); the thresholds differ because the calibration does.
          STALLWATCH_SECS: "480"
          STALLWATCH_SILENCE_SECS: "900"
          STALLWATCH_LOG: /tmp/clippy-leg.log
        run: |
          STALLWATCH=""
          if command -v python3 >/dev/null 2>&1; then
          cat > /tmp/clippywatch.py <<'CLIPPYWATCH_PY'
          #!/usr/bin/env python3
          """Compile-phase stall watchdog for the LINT leg (fmt + clippy).

          WHY THIS JOB HAS A SMALLER DETECTOR THAN pr-gates-nextest. That job runs tests,
          so it carries three predicates. THIS job only COMPILES: `cargo clippy --lib
          --bins --tests --benches --all-features` builds the whole tree and never
          executes a test binary, so predicate B ("no test completing") has no signal to
          read and is deliberately ABSENT. Copying it would add ~150 lines that can never
          fire, and a detector that cannot fire on its own surface is worse than none: it
          reads as coverage.

          Predicate A -- FLAT CPU over this step's own process tree (STALLWATCH_SECS, 480).
            A compiling rustc advances utime+stime on every sample, so healthy work cannot
            accumulate flat time. This is the arm that catches a wedged rustc or a futex
            hang, and it needs no output at all -- which matters because cargo buffers
            heavily and a silent-but-working compile is normal.

          Predicate C -- LOG SILENCE (STALLWATCH_SILENCE_SECS, 900).
            The OUTPUT-based arm: a tree burning CPU while emitting nothing is exactly
            what A cannot see. Armed only once the tee'd log is NON-EMPTY -- an absent log
            is not silence, it is "cargo has not written its first byte yet".

          CALIBRATION for C, measured 2026-11-22 from six cold/failing runs (283 intra-step
          gaps): worst healthy compile silence 152.9 s, always the same `Checking
          whatsapp-rust v0.7.0` dependency compile; p99 128.0 s, p50 0 s. 900 s is 5.9x the
          worst gap. Every threshold is a multiple of the WORST gap, never of the median --
          a false trip fails a healthy gate.
          Do NOT recalibrate from `gh run view --log`: it truncates mid-compile and runs
          straight into the NEXT step, so the "silence" it reports is an artifact of the
          reader. Measured this turn: the same window read 438-580 s of "silence" that was
          entirely the following step. Bound any read to the step's own output window.

          Signal for A: sum(utime+stime) over every process descending from the step shell.
          Tree scoping is load-bearing -- a comm-wide match picks up the opencrabs daemon
          and resets the flat clock forever (measured on the test leg).

          ON FIRE: dump wchan + /proc/<pid>/syscall + kernel stack + vmstat + the log tail,
          THEN SIGTERM the tree. The dump runs BEFORE the kill, so even a wrong fire yields
          evidence. This converts a 25-minute silent burn into ~8 minutes plus the stack
          that names the mechanism. gdb is NOT installed in this job (it is a nextest-job
          dependency), so user stacks are reported unavailable rather than silently absent;
          the kernel side separates futex from read/fsync on its own.

          FAIL-OPEN BUT VISIBLY SO: no python3, or an unparsable heredoc, emits a
          `::warning::` and continues; arming emits a `::notice::`. Without those, "no stall
          detected" and "the detector never ran" are the same green run.
          Revert = delete this block and restore the plain `run: cargo clippy ...` line.
          """
          import os
          import signal
          import subprocess
          import sys
          import time

          SELF = os.getpid()
          FLAT_THRESHOLD = int(os.environ.get("STALLWATCH_SECS", "480"))
          SILENCE_THRESHOLD = int(os.environ.get("STALLWATCH_SILENCE_SECS", "900"))
          SAMPLE = int(os.environ.get("STALLWATCH_SAMPLE", "30"))
          LOGFILE = os.environ.get("STALLWATCH_LOG", "/tmp/clippy-leg.log")


          def _stat(pid):
              """(comm, cpu_ticks, ppid, state) from /proc/<pid>/stat, or None."""
              try:
                  with open("/proc/%d/stat" % pid, "rb") as fh:
                      raw = fh.read()
              except OSError:
                  return None
              close = raw.rfind(b")")
              if close < 0:
                  return None
              comm = raw[raw.find(b"(") + 1:close].decode("utf-8", "replace")
              fields = raw[close + 2:].split()
              try:
                  state = fields[0]
                  ppid, utime, stime = int(fields[1]), int(fields[11]), int(fields[12])
              except (IndexError, ValueError):
                  return None
              return comm, utime + stime, ppid, state


          def descendants(root):
              """{pid: (comm, cpu_ticks)} for EVERY descendant of `root`, minus this watcher.

              No comm filter, deliberately: a wedged rustc is `rustc`, but whatever wedges
              it can be any child, and a build-tools filter is exactly what made the test-leg
              detector report procs=1 and never name the stuck process. Zombies are excluded
              -- a reaped-but-unwaited child burns no CPU and cannot stall anything, and
              counting it keeps the tree non-empty after the work finishes.
              """
              table = {}
              for entry in os.listdir("/proc"):
                  if not entry.isdigit():
                      continue
                  rec = _stat(int(entry))
                  if rec:
                      table[int(entry)] = rec
              procs = {}
              for pid, (comm, ticks, _ppid, state) in table.items():
                  if pid == SELF or state == b"Z":
                      continue
                  cur, hops = pid, 0
                  while cur > 1 and hops < 64:
                      rec = table.get(cur)
                      if rec is None:
                          break
                      parent = rec[2]
                      if parent == root:
                          procs[pid] = (comm, ticks)
                          break
                      cur, hops = parent, hops + 1
              return procs


          def _log_tail(n=40):
              try:
                  with open(LOGFILE, "rb") as fh:
                      fh.seek(0, os.SEEK_END)
                      size = fh.tell()
                      fh.seek(max(0, size - 64 * 1024))
                      lines = fh.read().decode("utf-8", "replace").splitlines()
              except OSError:
                  return
              print("----- clippy log tail (last %d lines) -----" % n)
              for line in lines[-n:]:
                  print("LOGTAIL: %s" % line[:300])


          def dump(procs, stall_s, predicate):
              stamp = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              print("===== STALLWATCH FIRE %s predicate=%s stall=%.0fs procs=%d ====="
                    % (stamp, predicate, stall_s, len(procs)), flush=True)
              for pid, (comm, ticks) in sorted(procs.items()):
                  try:
                      wchan = open("/proc/%d/wchan" % pid).read().strip()
                  except OSError:
                      wchan = "?"
                  print("STALLWATCH: pid=%d comm=%s cpu_ticks=%d wchan=%s" % (pid, comm, ticks, wchan))
              print("----- vmstat -----")
              subprocess.run(["vmstat", "1", "3"], check=False)
              _log_tail()
              print("----- syscall + kernel stack -----")
              for pid, (comm, _) in sorted(procs.items()):
                  for label, argv in (
                      ("syscall", ["cat", "/proc/%d/syscall" % pid]),
                      ("kstack", ["sudo", "cat", "/proc/%d/stack" % pid]),
                  ):
                      try:
                          res = subprocess.run(argv, check=False, stdout=subprocess.PIPE,
                                               stderr=subprocess.STDOUT, timeout=20)
                          out = res.stdout.decode("utf-8", "replace").strip()
                      except (OSError, subprocess.TimeoutExpired) as exc:
                          out = "unavailable: %r" % (exc,)
                      print("STALLWATCH %s pid=%d: %s" % (label, pid, out[:2000]), flush=True)
              print("STALLWATCH: user stacks not collected -- this job installs no gdb (a "
                    "nextest-job dependency only). The kernel-side evidence above separates "
                    "futex from read/fsync on its own.", flush=True)
              print("===== STALLWATCH END =====", flush=True)


          def terminate(procs, stall_s, predicate):
              for pid in procs:
                  try:
                      os.kill(pid, signal.SIGTERM)
                  except OSError:
                      pass
              print("STALLWATCH: SIGTERM sent to %d process(es) after %.0fs without progress (%s)"
                    % (len(procs), stall_s, predicate), flush=True)


          def main():
              root = int(os.environ.get("STALLWATCH_ROOT") or os.getppid())
              print("STALLWATCH: armed, root=%d flat=%ds silence=%ds sample=%ds log=%s"
                    % (root, FLAT_THRESHOLD, SILENCE_THRESHOLD, SAMPLE, LOGFILE), flush=True)
              prev = None
              flat_since = None
              log_size = None
              silence_since = None   # None until the log is NON-EMPTY: absent is not silence
              while True:
                  procs = descendants(root)
                  total = sum(t for _, t in procs.values())
                  now = time.time()

                  # Predicate A -- flat CPU. Catches a wedged rustc; needs no output at all.
                  if not procs:
                      prev, flat_since = None, None
                  elif prev is None or total != prev:
                      prev, flat_since = total, now
                  else:
                      flat = now - flat_since
                      if flat >= FLAT_THRESHOLD:
                          dump(procs, flat, "flat_cpu")
                          terminate(procs, flat, "flat_cpu")
                          return 0

                  # Predicate C -- log silence. Armed only once the log is non-empty.
                  try:
                      size = os.path.getsize(LOGFILE)
                  except OSError:
                      size = None
                  if size is None or size == 0 or not procs:
                      silence_since = None
                  elif log_size is None or size != log_size:
                      silence_since = now
                  else:
                      silent = now - silence_since
                      if silent >= SILENCE_THRESHOLD:
                          dump(procs, silent, "silence")
                          terminate(procs, silent, "silence")
                          return 0
                  log_size = size

                  time.sleep(SAMPLE)


          if __name__ == "__main__":
              sys.exit(main())
          CLIPPYWATCH_PY
            if python3 -c 'import ast; ast.parse(open("/tmp/clippywatch.py").read())' 2>/dev/null; then
              python3 /tmp/clippywatch.py &
              STALLWATCH=$!
              echo "::notice::STALLWATCH armed (clippy leg) -- flat=${STALLWATCH_SECS}s silence=${STALLWATCH_SILENCE_SECS}s; a green run carrying this notice is evidence the detector RAN"
            else
              echo "::warning::STALLWATCH DISARMED (clippy leg) -- embedded script does not parse; NO stall detection this run"
            fi
          else
            echo "::warning::STALLWATCH DISARMED (clippy leg) -- python3 not on PATH; NO stall detection this run"
          fi
          # tee so predicate C has a file to watch; PIPESTATUS[0], never $? --
          # `| tee` makes $? TEE's status, so a failing clippy would report 0.
          cargo clippy --locked --lib --bins --tests --benches --all-features -- -D warnings 2>&1 | tee "$STALLWATCH_LOG"
          RC=${PIPESTATUS[0]}
          if [ -n "$STALLWATCH" ]; then
            kill "$STALLWATCH" 2>/dev/null || true
            wait "$STALLWATCH" 2>/dev/null || true
          fi
          exit $RC


      - name: Apply cargo fmt (fix mode)
        if: ${{ inputs.fix }}
        run: |
          cargo fmt --all
          git diff > fmt-fix.patch
          git diff --stat | tee fmt-fix.stat
          echo "ref=${{ inputs.ref }}" > fmt-fix.meta
          echo "patch_bytes=$(wc -c < fmt-fix.patch)" >> fmt-fix.meta

      - name: Upload fmt-fix patch
        if: ${{ inputs.fix }}
        uses: actions/upload-artifact@v4
        with:
          name: fmt-fix
          path: |
            fmt-fix.patch
            fmt-fix.stat
            fmt-fix.meta
          if-no-files-found: error

      - name: "Guard: existing Cargo.lock present (lock-regen mode)"
        if: ${{ inputs.lockregen }}
        # Minimal re-resolve REQUIRES the existing lock: cargo metadata with
        # no lock does a full re-resolve (the semver churn we're avoiding).
        # Fail loudly instead of churning.
        run: test -f Cargo.lock

      - name: Minimal lock re-resolve (lock-regen mode)
        if: ${{ inputs.lockregen }}
        run: |
          cargo metadata --format-version=1 > /dev/null
          echo "=== lock delta ==="
          git diff --stat Cargo.lock
          git diff Cargo.lock | head -300

      - name: Upload regen-lock (lock-regen mode)
        if: ${{ inputs.lockregen }}
        uses: actions/upload-artifact@v4
        with:
          name: regen-lock
          path: Cargo.lock
          if-no-files-found: error

      - name: "Guard: existing Cargo.lock present (lock-update mode)"
        if: ${{ inputs.lockupdate }}
        # `cargo update` rewrites an existing lock. With no lock it would
        # resolve from scratch, which is a different (and unreviewable) delta.
        run: test -f Cargo.lock

      - name: Full semver-compatible lock update (lock-update mode)
        if: ${{ inputs.lockupdate }}
        # `cargo update` with no arguments moves every package to the newest
        # version its REQUIREMENT in Cargo.toml still admits — patch and minor
        # for 1.x+, patch only for 0.x. Requirements are never rewritten here;
        # a 0.x minor bump is a manifest edit and a separate, gated change.
        #
        # lock_pins then holds named crates back. Needed because a caret
        # requirement on a PRERELEASE (`^2.0.0-rc0`) admits the release
        # (`2.0.0`) even when the dependent was written against the rc API —
        # measured on glass_pumpkin 2.0.0 / grammers-crypto 0.10.0, where
        # `is_prime` gained a Result return and the dependent still negates it.
        # A pin is a LOCK-only hold: no requirement changes, so the delta stays
        # reviewable, and the crate that needs the newer version is a Pass-B
        # requirement raise (grammers-crypto 0.11 wants ^2.0.0 and ^0.5).
        env:
          LOCK_PINS: ${{ inputs.lock_pins }}
        run: |
          cargo update 2>&1 | tee /tmp/cargo-update.log
          echo "=== packages moved ==="
          grep -cE '^\s+Updating ' /tmp/cargo-update.log || true
          if [ -n "$LOCK_PINS" ]; then
            echo "=== applying lock pins ==="
            for pin in $LOCK_PINS; do
              pkg="${pin%@*}"
              ver="${pin##*@}"
              if [ -z "$pkg" ] || [ -z "$ver" ] || [ "$pkg" = "$pin" ]; then
                echo "MALFORMED PIN '$pin' (want pkg@version)" >&2
                exit 1
              fi
              echo "--- pinning $pkg -> $ver"
              cargo update -p "$pkg" --precise "$ver" 2>&1 | tee -a /tmp/cargo-update.log
            done
            echo "=== pinned versions in lock ==="
            for pin in $LOCK_PINS; do
              pkg="${pin%@*}"
              grep -A1 "^name = \"$pkg\"$" Cargo.lock | head -2 || true
            done
          fi
          echo "=== lock delta ==="
          git diff --stat Cargo.lock
          git diff Cargo.lock | head -400

      - name: Upload updated-lock (lock-update mode)
        if: ${{ inputs.lockupdate }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-lock
          path: Cargo.lock
          if-no-files-found: error

  # ------------------------------------------------ nextest, BLOCKING VERDICT --
  # PROMOTED TO BLOCKING 2026-11-20 (owner order: "get rid of the all-features
  # job and promote nextest"). The all-features job is DELETED; this job is the
  # test verdict.
  #
  # WHY NEXTEST CARRIES THE VERDICT: process-per-test isolation plus
  # `slow-timeout` converts "the suite hangs for 53 minutes and reports nothing"
  # into "test X exceeded 10 minutes, named". That is the ONLY mechanism here
  # that turns a global-mutex deadlock (the SQLite unixLock/unixClose class) from
  # a lost run into a diagnosis. `cargo test` cannot do it: one wedged test
  # blocks the whole binary.
  #
  # EVIDENCE FOR THE PROMOTION, measured before it was made (7 completed runs,
  # 2026-11-19..20): 7/7 completed, 6 success + 1 cancelled, ZERO failures, and
  # every step `success`. Median job wall 13.9 min (min 12.1, max 16.9) — FASTER
  # than the blocking `lint` job's 16.5 min median, which carries fmt+clippy
  # as well. The deleted all-features job cost 28.9 min median and produced no
  # verdict.
  #
  # DOCTESTS: nextest runs libtest binaries only and NEVER runs doctests, so the
  # step below runs `cargo test --doc` separately. Without it those examples
  # silently stop being tested.
  #
  # THE FLAG THAT BITES: nextest's `--profile` selects a NEXTEST profile (a
  # config section), NOT a cargo profile. `--profile ci` would look for
  # `[profile.ci]` in .config/nextest.toml and find nothing; the cargo profile
  # is `--cargo-profile ci`. Do not "correct" this to match the leg above.
  #
  # NO JUNIT ARTIFACT (deleted 2026-11-22): 157 uploaded, zero download-artifact
  # steps in the repo. The profile file below is now only the slow-timeout.
  #
  # COVERAGE NOTE: nextest runs libtest binaries; doctests are not part of its
  # run. That gap is closed by the explicit `Doctests` step below — NOT by
  # another job. This job is the blocking test verdict (2026-11-20), so anything
  # it does not run, nothing runs.
  #
  # Deliberately NO sccache: RUSTC_WRAPPER=sccache on a test leg is the
  # 2026-09-17 SIGTERM storm (3/3 killed vs 0/5-0/6 without). The action was
  # removed from the WHOLE gate on 2026-11-21 (cache-budget note, file top);
  # this job never had it and still must not.
  #
  # COST: one full compile + test per gate dispatch, on its own rust-cache key.
  # That cost is not avoidable by gating: this job IS the verdict, so it is not
  # an extra leg to switch off — do not put it behind an input and do not move it
  # to a schedule. Gating the only test verdict deletes the verdict.
  #
  # Revert = delete this job.
  pr-gates-nextest:
    if: ${{ inputs.mode == 'gate' && !inputs.fix && !inputs.lockregen && !inputs.lockupdate && !inputs.fast }}
    name: PR-lane nextest (blocking verdict)
    runs-on: ubuntu-latest
    # 60, NOT 45 (2026-11-20). The two step ceilings alone are 40 (nextest) +
    # 15 (doctests) = 55, before ~2 min of setup and the envelope probes. A 45
    # job cap therefore guaranteed that any run reaching its own step timeouts
    # lost the DOCTEST leg to a job-cap cancel — which archives an empty log, so
    # the loss was invisible (#331). The step timeouts stay the primary guard;
    # the job cap is now only the backstop above their sum.
    timeout-minutes: 60
    # These tuning variables are step-scoped on both cargo invocations below.
    # rust-cache hashes job-level CARGO_* values into its key; keeping them out
    # of the job environment prevents every tuning change from minting another
    # full target-cache variant. Both cargo steps still receive identical values,
    # so they share the same profile and build-parallelism settings.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: "Resolve shipped feature set (single source: quick-build-linux.yml)"
        # THE VERDICT TESTS WHAT WE SHIP, FROM THE ONE PLACE THAT SAYS WHAT THAT
        # IS (2026-11-22). An EMPTY `features` resolves from quick-build-linux.yml's
        # dispatch default, read from THIS workflow's ref — never the gated
        # checkout, so a gated tree cannot change what it is gated against.
        # Unparseable or absent => hard failure; a silent fallback is how the
        # two copies drifted in the first place.
        env:
          CARRIER_REF: ${{ github.ref_name }}
          EXPLICIT: ${{ inputs.features }}
        run: |
          if [ -n "$EXPLICIT" ]; then
            echo "FEATURES=$EXPLICIT" >> "$GITHUB_ENV"
            echo "feature set (explicit input): $EXPLICIT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$CARRIER_REF:refs/remotes/carrier/$CARRIER_REF" \
            || { echo "::error::cannot fetch '$CARRIER_REF' to read quick-build-linux.yml"; exit 1; }
          SET=$(git show "refs/remotes/carrier/$CARRIER_REF:.github/workflows/quick-build-linux.yml" | awk '
            { match($0, /^ */); ind = RLENGTH }
            inblk == 0 && $0 ~ /^[[:space:]]*features:[[:space:]]*$/ { inblk = 1; base = ind; next }
            inblk && ind <= base && $0 !~ /^[[:space:]]*$/ { exit }
            inblk && $0 ~ /^[[:space:]]*default:/ { sub(/^[[:space:]]*default:[[:space:]]*/, ""); gsub(/^["\047]|["\047]$/, ""); print; exit }
          ')
          case "$SET" in
            "") echo "::error::quick-build-linux.yml carries no parseable features default"; exit 1 ;;
            *[!A-Za-z0-9,_-]*) echo "::error::unexpected feature set '$SET' parsed from quick-build-linux.yml"; exit 1 ;;
          esac
          echo "FEATURES=$SET" >> "$GITHUB_ENV"
          echo "feature set (quick-build-linux.yml @ $CARRIER_REF): $SET"

      - name: Install Rust (pinned 1.100.0, see TOOLCHAIN DECISION)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          # No `components:` here, unlike the linux-amd64 and lint jobs: this job
          # runs neither rustfmt nor clippy, so installing them is pure setup
          # cost. nextest and doctests need only the compiler.

      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: true

      - name: Install system deps (pkg-config, ALSA dev, mold + clang, gdb)
        # gdb IS A TEST-LEG DEPENDENCY, not a debugging convenience (#331/#1936).
        # STALLWATCH's fire-time dump captures kernel-side evidence with no gdb
        # (/proc/<pid>/wchan, kstack, vmstat) but the USER stacks -- the only
        # thing that shows a deadlock cycle -- need it. Measured consequence of
        # NOT having it (job 134706016808, run 44276536423): the watchdog fired
        # correctly, named `opencrabs-e23d8` in futex_do_wait, and printed
        # "gdb not on PATH - user stacks skipped". An instrument that cannot run
        # on the failing dispatch is not an instrument.
        #
        # ptrace: gdb attaches to the test binary as a SIBLING and ubuntu-latest
        # ships YAMA ptrace_scope=1, which refuses a sibling attach -- measured,
        # run 37317799177: the watchdog armed on the right pid and fired 3x, but
        # every dump read "Could not attach to process ... ptrace_scope". The
        # dump also runs under sudo (YAMA exempts root), so `|| true` is safe:
        # some runners expose the knob read-only.
        #
        # Folded into THIS step rather than a separate "Install gdb" step: it
        # reuses the apt-get update below and saves ~20-30 s per dispatch.
        # No step-level `if:` is needed -- the JOB already requires
        # `mode == 'gate' && !fix && !lockregen && !lockupdate && !fast`, which
        # is a superset of the predicate the old leg carried.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y pkg-config libasound2-dev mold clang gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo unknown)"

      - name: Install cargo-nextest
        # PINNED (2026-11-21, factory #126). `@nextest` is not a version: the
        # action resolves `cargo-nextest@latest` at run time, so the toolchain
        # that decides every PR's verdict drifted with the calendar, and a bad
        # release would fail every dispatch at once with no commit to revert.
        # 0.9.152 is the version measured on this gate (run 44811338854).
        # Re-pin deliberately as its own reviewable commit.
        uses: taiki-e/install-action@nextest
        with:
          tool: cargo-nextest@0.9.152

      - name: Configure nextest profile (slow-timeout)
        # The `[profile.default.junit]` half went with the artifact it fed. The
        # slow-timeout is load-bearing: it turns a hung test into a NAMED
        # 10-minute failure instead of a 45-minute silence.
        run: |
          mkdir -p .config
          printf '%s\n' \
            '[profile.default]' \
            '# A HUNG test is TERMINATED AND NAMED instead of hanging the suite for' \
            '# 45 minutes with no evidence. terminate-after=5 x period=120s => 10 min' \
            '# ceiling per test, well above the slowest known healthy test (the' \
            '# rate-limit deadline test, ~60-120s).' \
            'slow-timeout = { period = "120s", terminate-after = 5 }' \
            > .config/nextest.toml
          cat .config/nextest.toml

      - name: "Diagnose: resource envelope"
        if: ${{ inputs.diagnose }}
        # Input-gated diagnostic (default false). Every probe is `|| true`:
        # a measurement that can fail the gate it measures is worthless.
        run: |
          echo "===== DIAG pre-test $(date -u +%FT%TZ) ====="
          echo "--- cpu ---"
          nproc; grep -m1 'model name' /proc/cpuinfo || true
          echo "--- mem (MiB) ---"
          free -m || true
          echo "--- disk ---"
          df -h / || true; df -h "$GITHUB_WORKSPACE" || true
          echo "--- meminfo anchor (kB) ---"
          grep -E '^(MemTotal|MemAvailable|SwapTotal):' /proc/meminfo || true
          echo "--- cgroup layout ---"
          cat /proc/self/cgroup 2>/dev/null || true
          ls -la /sys/fs/cgroup 2>/dev/null | head -25 || true
          mount 2>/dev/null | grep -i cgroup || true
          echo "--- cgroup memory limits (resolved path, then ancestors) ---"
          # The 2026-09-18 baseline run showed /sys/fs/cgroup/memory.max as
          # UNREADABLE (the loop printed nothing), so the ceiling could not be
          # read from the fixed path. Resolve the runner's OWN cgroup from
          # /proc/self/cgroup and walk up, labelling every hit with its full
          # path so an absent reading is distinguishable from a real "max".
          CG=$(sed -n 's/^0:://p' /proc/self/cgroup 2>/dev/null)
          for base in /sys/fs/cgroup "${CG:+/sys/fs/cgroup$CG}"; do
            [ -d "$base" ] || continue
            d="$base"
            while [ -n "$d" ] && [ "$d" != "/" ] && [ "$d" != "/sys" ] && [ "$d" != "/sys/fs" ]; do
              for f in memory.max memory.peak memory.current memory.high memory.swap.max; do
                if [ -r "$d/$f" ]; then echo "$d/$f = $(cat "$d/$f")"; fi
              done
              d=$(dirname "$d")
            done
          done
          echo "--- cgroup v1 memory (fallback) ---"
          for f in memory.limit_in_bytes memory.max_usage_in_bytes; do
            [ -r "/sys/fs/cgroup/memory/$f" ] && echo "/sys/fs/cgroup/memory/$f = $(cat "/sys/fs/cgroup/memory/$f")" || true
          done
          echo "--- cache sizes ---"
          du -sh target 2>/dev/null || true
          du -sh "$HOME/.cargo/registry" 2>/dev/null || true
          echo "===== DIAG pre-test END ====="

      - name: Run tests under nextest (shipped feature set, BLOCKING verdict)
        # Step timeout INSIDE the 45-min job cap so a stall still leaves a log
        # (a job-cap cancel archives a 22-byte empty zip; #331).
        #
        # STALLWATCH (re-homed 2026-11-20 from the deleted `cargo test` leg).
        # THREE predicates, because a stall has three shapes:
        #   A. FLAT CPU over this step's own process tree (480 s). Covers compile
        #      and futex wedges; BLIND to a test spinning on CPU.
        #   B. NO TEST COMPLETING (780 s), counted from this step's own log. Armed
        #      only after the FIRST completion: compile legitimately prints zero
        #      result lines for 20+ minutes. Recognises libtest AND nextest shapes.
        #      CALIBRATION 2026-11-19, six GREEN runs (~67,000 completions): worst
        #      healthy gap with no completion is 63 s, always the slow rate-limit
        #      deadline test. 780 s is 12.4x that.
        #      780, NOT 600 (2026-11-20): nextest's OWN terminate ceiling is
        #      5 x 120 s = 600 s, so a 600 s predicate B fired at the SAME instant
        #      as nextest's termination and our SIGTERM beat nextest's — destroying
        #      the one thing worth having on a hung last test case, the NAME of the
        #      test nextest would have reported. 780 clears that ceiling by 180 s
        #      while staying 5.2x the entire healthy test phase.
        #   C. LOG SILENCE (900 s). Covers the shape A and B both miss: CPU
        #      advancing while no output is emitted. CALIBRATION measured
        #      2026-11-20 from FULL per-job archives (gh api
        #      .../actions/jobs/<id>/logs), three GREEN runs: 44689498798 = 349.3 s,
        #      44689314886 = 392.3 s, 44589184921 = 532.4 s of healthy compile
        #      silence, all one crate (`opencrabs` lib test) at O3/thin-LTO.
        #      900 s is 1.69x the WORST healthy gap. A literal 600 s would have
        #      killed run 44589184921 while it was perfectly healthy.
        #      Never calibrate C from `gh run view --log`: it truncates mid-compile.
        #      A false trip on a healthy gate is a CALIBRATION DEFECT to fix by
        #      RAISING the threshold, never a reason to disable C.
        #
        # WHY THE LOG EXISTS: B counts completions in it and C watches its size, so
        # the step tees and takes the exit code from ${PIPESTATUS[0]}. A bare
        # `| tee` makes $? TEE's status -- a failing test would report 0, the
        # false-green class this factory exists to kill.
        #
        # FAIL-OPEN but VISIBLY SO: no python3 or an unparsable heredoc emits a
        # `::warning::` and continues; arming emits a `::notice::`. Without those,
        # "no stall detected" and "the detector never ran" are the same green run
        # (the #1936 trap). Revert = delete this block and the STALLWATCH teardown.
        #
        # NO `${{ }}` INSIDE THE RUN BLOCK. A template expression in a 14 KB run
        # block trips the 21,000-char cap and made the carrier undeployable for an
        # hour. `features` is passed via env as $FEATURES; never re-inline it.
        timeout-minutes: 40
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          # Moved out of the run block on purpose -- see NO `${{ }}` above.
          # NOT set here: it comes from the `Resolve shipped feature set` step
          # via $GITHUB_ENV, which is the whole point of that step. A step-level
          # copy would shadow the resolved value and re-introduce the second one.
          # Keep these step-scoped: rust-cache hashes job-level CARGO_* values.
          CARGO_PROFILE_CI_STRIP: "false"
          CARGO_BUILD_JOBS: "3"
          STALLWATCH_SECS: "480"
          STALLWATCH_PROGRESS_SECS: "780"
          STALLWATCH_SILENCE_SECS: "900"
          STALLWATCH_LOG: /tmp/test-leg.log
        run: |
          STALLWATCH=""
          if command -v python3 >/dev/null 2>&1; then
          cat > /tmp/stallwatch.py <<'STALLWATCH_PY'
          #!/usr/bin/env python3
          """Stall watchdog for the CI gate. THREE predicates, because a stall has three shapes.

          Predicate A -- FLAT CPU over the step's own process tree (STALLWATCH_SECS, 480).
            Covers the COMPILE phase and any futex wedge: a rustc that stops advancing
            utime+stime, or a test parked in futex_do_wait. First production fire 2026-11-18
            (run 44276536423) named `opencrabs-e23d8` at wchan=futex_do_wait. BLIND to a test
            spinning on CPU: ticks keep advancing, so the flat clock never accumulates -- it
            fired on 0 of 6 job-cap stalls for exactly that reason.

          Predicate B -- NO TEST COMPLETING (STALLWATCH_PROGRESS_SECS, 780).
            Counts COMPLETION markers in the step's own log and fires when the count stops
            advancing. Two harness shapes are recognised: libtest
            (`test <name> ... ok|FAILED|ignored`, doc-tests included) and nextest
            (`        PASS [   0.003s] <name>`). RE-HOMED 2026-11-20 from the deleted
            `cargo test` leg into `pr-gates-nextest`, which is why both shapes are matched.
            ARMS ONLY AFTER THE FIRST COMPLETION: compile legitimately produces zero result
            lines for 20+ minutes, so a naive "no progress in N" would kill every cold run.

            CALIBRATION (2026-11-19, six GREEN runs: 44323730941, 44337942773, 44369135092,
            44414539307, 44500485926, 44511279765; ~67,000 completions): the longest healthy
            stretch with NO completion is 63 s, always the same slow rate-limit deadline test
            (it prints "has been running for over 60 seconds" while healthy); p99 = p95 = 0 s.
            780 s is 12.4x the worst healthy gap and 5.2x the ENTIRE healthy test phase. Do NOT
            derive it from log silence -- that is C's calibration and a DIFFERENT number.
            Conflating them is what left the detector firing zero times for six stalls. A
            false trip fails a healthy gate, so every threshold is a multiple of the WORST
            gap, never of the median.

          Signal for A: sum(utime+stime) over EVERY process descending from the step shell
          (STALLWATCH_ROOT). Tree scoping is load-bearing: a box-wide comm match picks up
          unrelated processes and resets the flat clock forever (measured -- the opencrabs
          daemon matched `opencrabs` and the instrument never fired). `tee` is a descendant
          and sits INSIDE the sum, harmless only because it is idle exactly when output
          stops. Do not widen the tree scope to "fix" that.

          Signal for C: the SIZE of /tmp/test-leg.log. C is the only predicate that reads
          OUTPUT rather than process state, and it exists because A needs CPU to go FLAT
          and B needs a completion to have ALREADY happened: a tree burning CPU while
          emitting no output satisfies neither. Armed only once the file is non-empty --
          compile starts before `tee` writes its first byte, and an absent or empty log is
          not silence. Calibration is the WORST healthy compile gap measured from FULL
          per-job archives; the three run ids and the 1.69x margin are in the step comment
          above. Do NOT calibrate this from `gh run view --log`: it truncates mid-compile,
          so the "silence" it reports is an artifact of the reader, not of the run.

          On fire: dump wchan, /proc/<pid>/syscall, kernel stack, vmstat and user stacks
          (gdb), plus the test-log tail so the in-flight test is named, then SIGTERM the
          tree so the step fails fast instead of burning to the 40-minute timeout. The dump
          runs BEFORE the SIGTERM, so even a wrong fire yields evidence. Every fire line
          names WHICH predicate fired and both counters: one message shape for two triggers
          would leave the next reader unable to tell a spin from a wedge.
          """
          import os
          import re
          import signal
          import shutil
          import subprocess
          import sys
          import time

          # This watcher's own pid. It wakes every SAMPLE seconds, so counting it in the CPU sum
          # would reset the flat clock forever.
          SELF = os.getpid()
          THRESHOLD = int(os.environ.get("STALLWATCH_SECS", "480"))
          PROGRESS_THRESHOLD = int(os.environ.get("STALLWATCH_PROGRESS_SECS", "780"))
          SILENCE_THRESHOLD = int(os.environ.get("STALLWATCH_SILENCE_SECS", "900"))
          SAMPLE = int(os.environ.get("STALLWATCH_SAMPLE", "30"))
          LOGFILE = os.environ.get("STALLWATCH_LOG", "/tmp/test-leg.log")

          # Completion markers, BOTH harness shapes this detector has ever run under:
          #   libtest  -- `test src/lib.rs - foo (line 12) ... ok` (doc-tests included)
          #   nextest  -- `        PASS [   0.003s] crate::module::test_name`
          # The libtest arm is anchored at line start and requires the full `... ok|FAILED|
          # ignored` tail; the nextest arm requires the status word AND the `[  <dur>s]`
          # column, so the stallwatch comments echoed into the log cannot be counted as
          # completions by either arm.
          OK_RE = re.compile(
              rb"^test .+ \.\.\. (ok|FAILED|ignored)"
              rb"|^\s*(?:PASS|FAIL|SLOW|LEAK|TIMEOUT|ABORT|SIGSEGV|SIGBUS|SIGILL)\s+\[",
              re.M,
          )


          def _stat(pid):
              """(comm, cpu_ticks, ppid, state) from /proc/<pid>/stat, or None."""
              try:
                  with open("/proc/%d/stat" % pid, "rb") as fh:
                      raw = fh.read()
              except OSError:
                  return None
              close = raw.rfind(b")")
              if close < 0:
                  return None
              comm = raw[raw.find(b"(") + 1:close].decode("utf-8", "replace")
              fields = raw[close + 2:].split()
              try:
                  state = fields[0]
                  ppid, utime, stime = int(fields[1]), int(fields[11]), int(fields[12])
              except (IndexError, ValueError):
                  return None
              return comm, utime + stime, ppid, state


          def descendants(root):
              """{pid: (comm, cpu_ticks)} for EVERY descendant of `root`, minus this watcher.

              No comm filter, deliberately. A wedged TEST binary is `opencrabs-<hash>`: a
              build-tools filter left it out of both the dump and the CPU sum, so a local
              drive on 2026-11-17 reported procs=1 -- the parked `cargo` in wait4 -- and never
              named the process that was stuck. FIRST PRODUCTION FIRE 2026-11-18, run
              44276536423: flat=300s, procs=2, naming the wedged `opencrabs-e23d8`
              (wchan=futex_do_wait) and its parked `cargo` (wchan=do_wait), so the fix is
              confirmed in production.

              It also closes a false-positive path: over build tools only, `cargo` parked in
              wait4 reads as FLAT for the whole test phase, so any suite legitimately slower
              than the threshold would have been killed as a stall.
              """
              table = {}
              for entry in os.listdir("/proc"):
                  if not entry.isdigit():
                      continue
                  rec = _stat(int(entry))
                  if rec:
                      table[int(entry)] = rec

              procs = {}
              for pid, (comm, ticks, _ppid, state) in table.items():
                  # A ZOMBIE cannot stall anything: it has exited and is only waiting to be reaped.
                  # Counting it keeps the tree non-empty AFTER the tests finish, so the progress
                  # clock keeps running against a dead process (measured in the local drive: the
                  # healthy arm false-fired on a zombie child). Zombies also burn no CPU, so they
                  # are noise for both predicates.
                  if pid == SELF or state == b"Z":
                      continue
                  cur, hops = pid, 0
                  while cur > 1 and hops < 64:
                      rec = table.get(cur)
                      if rec is None:
                          break
                      parent = rec[2]
                      if parent == root:
                          procs[pid] = (comm, ticks)
                          break
                      cur, hops = parent, hops + 1
              return procs


          def read_completions(offset):
              """(new_offset, count) -- libtest result lines appended to LOGFILE since `offset`.

              Only COMPLETE lines are consumed: a partial trailing line is left for the next read,
              so a line split across two appends is counted exactly once.
              """
              try:
                  with open(LOGFILE, "rb") as fh:
                      fh.seek(offset)
                      chunk = fh.read()
              except OSError:
                  return offset, 0
              cut = chunk.rfind(b"\n")
              if cut < 0:
                  return offset, 0
              body = chunk[:cut + 1]
              return offset + len(body), len(OK_RE.findall(body))


          def _log_tail(n=40):
              try:
                  with open(LOGFILE, "rb") as fh:
                      fh.seek(0, os.SEEK_END)
                      size = fh.tell()
                      fh.seek(max(0, size - 64 * 1024))
                      lines = fh.read().decode("utf-8", "replace").splitlines()
              except OSError:
                  return
              print("----- test log tail (last %d lines) -----" % n)
              for line in lines[-n:]:
                  print("LOGTAIL: %s" % line[:300])


          def dump(procs, stall_s, predicate, completions):
              stamp = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              print("===== STALLWATCH FIRE %s predicate=%s stall=%.0fs procs=%d completions=%d ====="
                    % (stamp, predicate, stall_s, len(procs), completions), flush=True)
              for pid, (comm, ticks) in sorted(procs.items()):
                  try:
                      wchan = open("/proc/%d/wchan" % pid).read().strip()
                  except OSError:
                      wchan = "?"
                  print("STALLWATCH: pid=%d comm=%s cpu_ticks=%d wchan=%s" % (pid, comm, ticks, wchan))
              print("----- vmstat -----")
              subprocess.run(["vmstat", "1", "3"], check=False)
              _log_tail()
              # Kernel-side evidence needs no gdb: /proc/<pid>/syscall names the blocking syscall
              # (futex vs read/fsync/io_schedule) and /proc/<pid>/stack is the kernel stack that put
              # it to sleep. Both are cheap; /proc/<pid>/syscall is DENIED on the runner (measured
              # 2026-11-18: 'Operation not permitted' on both pids) and is reported as unavailable.
              print("----- syscall + kernel stack -----")
              for pid, (comm, _) in sorted(procs.items()):
                  for label, argv in (
                      ("syscall", ["cat", "/proc/%d/syscall" % pid]),
                      ("kstack", ["sudo", "cat", "/proc/%d/stack" % pid]),
                  ):
                      try:
                          res = subprocess.run(argv, check=False, stdout=subprocess.PIPE,
                                               stderr=subprocess.STDOUT, timeout=20)
                          out = res.stdout.decode("utf-8", "replace").strip()
                      except (OSError, subprocess.TimeoutExpired) as exc:
                          out = "unavailable: %r" % (exc,)
                      print("STALLWATCH %s pid=%d: %s" % (label, pid, out[:2000]), flush=True)
              print("----- user stacks -----")
              if not shutil.which("gdb"):
                  print("STALLWATCH: gdb not on PATH - user stacks skipped. This should NOT "
                        "happen on a test run: gdb is installed by this job's 'Install system "
                        "deps (pkg-config, ALSA dev, mold + clang, gdb)' step, which is "
                        "unconditional. If it is missing, that step failed. The kernel-side "
                        "evidence above (wchan + kstack, plus vmstat) separates futex from "
                        "read/fsync.")
              for pid, (comm, _) in sorted(procs.items() if shutil.which("gdb") else []):
                  print("===== STALLWATCH stack pid=%d comm=%s =====" % (pid, comm))
                  # sudo: YAMA exempts root from ptrace_scope on the runner
                  try:
                      res = subprocess.run(
                          ["sudo", "gdb", "-p", str(pid), "-batch", "-ex", "thread apply all bt"],
                          check=False, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                          timeout=180,
                      )
                      sys.stdout.write(res.stdout.decode("utf-8", "replace")[:12000])
                  except (OSError, subprocess.TimeoutExpired) as exc:
                      print("STALLWATCH: stack dump failed for pid=%d: %r" % (pid, exc))
              print("===== STALLWATCH END =====", flush=True)


          def terminate(procs, stall_s, predicate):
              for pid in procs:
                  try:
                      os.kill(pid, signal.SIGTERM)
                  except OSError:
                      pass
              print("STALLWATCH: SIGTERM sent to %d process(es) after %.0fs without progress (%s)"
                    % (len(procs), stall_s, predicate), flush=True)


          def main():
              root = int(os.environ.get("STALLWATCH_ROOT") or os.getppid())
              print("STALLWATCH: armed, root=%d flat=%ds progress=%ds silence=%ds sample=%ds log=%s"
                    % (root, THRESHOLD, PROGRESS_THRESHOLD, SILENCE_THRESHOLD, SAMPLE, LOGFILE),
                    flush=True)
              prev = None
              flat_since = None
              offset = 0
              completions = 0
              progress_since = None  # None until the FIRST completion: compile has no result lines
              log_size = None
              silence_since = None   # None until the log is NON-EMPTY: absent is not silence
              while True:
                  procs = descendants(root)
                  total = sum(t for _, t in procs.values())
                  now = time.time()

                  # Predicate A -- flat CPU. Phase-agnostic, and the only one that can see a
                  # compile-phase stall (no result lines exist yet).
                  if not procs:
                      prev, flat_since = None, None
                  elif prev is None or total != prev:
                      prev, flat_since = total, now
                  else:
                      flat = now - flat_since
                      if flat >= THRESHOLD:
                          dump(procs, flat, "flat_cpu", completions)
                          terminate(procs, flat, "flat_cpu")
                          return 0

                  # Predicate B -- no test completing. Catches the CPU-burning spin that A cannot.
                  offset, new = read_completions(offset)
                  if new:
                      completions += new
                      progress_since = now
                  elif completions and progress_since is not None and procs:
                      idle = now - progress_since
                      if idle >= PROGRESS_THRESHOLD:
                          dump(procs, idle, "progress", completions)
                          terminate(procs, idle, "progress")
                          return 0

                  # Predicate C -- log silence. The only OUTPUT-based arm: A needs CPU to go
                  # flat, B needs a completion to have already happened, and a tree burning
                  # CPU with no output satisfies neither. Armed only once the log is non-empty.
                  try:
                      size = os.path.getsize(LOGFILE)
                  except OSError:
                      size = None
                  if size is None or size == 0 or not procs:
                      silence_since = None
                  elif log_size is None or size != log_size:
                      silence_since = now
                  else:
                      silent = now - silence_since
                      if silent >= SILENCE_THRESHOLD:
                          dump(procs, silent, "silence", completions)
                          terminate(procs, silent, "silence")
                          return 0
                  log_size = size

                  time.sleep(SAMPLE)


          if __name__ == "__main__":
              sys.exit(main())
          STALLWATCH_PY
            if python3 -c 'import ast; ast.parse(open("/tmp/stallwatch.py").read())' 2>/dev/null; then
              python3 /tmp/stallwatch.py &
              STALLWATCH=$!
              echo "::notice::STALLWATCH armed -- flat=${STALLWATCH_SECS}s progress=${STALLWATCH_PROGRESS_SECS}s silence=${STALLWATCH_SILENCE_SECS}s; a green run carrying this notice is evidence the detector RAN"
            else
              echo "::warning::STALLWATCH DISARMED -- embedded script does not parse; NO stall detection this run"
            fi
          else
            echo "::warning::STALLWATCH DISARMED -- python3 not on PATH; NO stall detection this run"
          fi
          # nextest's own per-test output lives under target/nextest/, and
          # rust-cache RESTORES target/, so a stale directory from an EARLIER run
          # survives into this one. The JUnit artifact that made this a
          # false-green surface is gone (2026-11-22), but the cleanup stays: it
          # costs one `rm` and keeps every future report-shaped output honest.
          rm -rf target/nextest
          # tee so B and C have a file; PIPESTATUS[0], never $? (see above).
          cargo nextest run --locked --cargo-profile ci \
            --no-default-features --features "$FEATURES" \
            --verbose 2>&1 | tee "$STALLWATCH_LOG"
          RC=${PIPESTATUS[0]}
          if [ -n "$STALLWATCH" ]; then
            kill "$STALLWATCH" 2>/dev/null || true
            wait "$STALLWATCH" 2>/dev/null || true
          fi
          exit $RC

      - name: "Diagnose: resource envelope (post-test)"
        if: ${{ always() && inputs.diagnose }}
        # POST-TEST READ. `always()` is load-bearing: the envelope worth having is
        # the one left behind by a run that FAILED or was cancelled, and a bare
        # `inputs.diagnose` would skip exactly those. Every probe is `|| true`:
        # a measurement that can fail the gate it measures is worthless.
        #
        # WHY IT IS NEEDED: the pre-test probe runs BEFORE this job compiles
        # anything, so the `memory.peak` it prints describes whatever last ran in
        # this cgroup -- an earlier job's leftovers, not this leg's compilation.
        # A run's peak is only readable AFTER it. That is precisely why #331's
        # 97.1% figure could not be attributed to a phase: the only probe we had
        # fired before the work started.
        run: |
          echo "===== DIAG post-test $(date -u +%FT%TZ) ====="
          echo "--- mem (MiB) ---"
          free -m || true
          echo "--- meminfo anchor (kB) ---"
          grep -E '^(MemTotal|MemAvailable|SwapTotal):' /proc/meminfo || true
          echo "--- cgroup memory (resolved path, then ancestors) ---"
          CG=$(sed -n 's/^0:://p' /proc/self/cgroup 2>/dev/null)
          for base in /sys/fs/cgroup "${CG:+/sys/fs/cgroup$CG}"; do
            [ -d "$base" ] || continue
            d="$base"
            while [ -n "$d" ] && [ "$d" != "/" ] && [ "$d" != "/sys" ] && [ "$d" != "/sys/fs" ]; do
              for f in memory.max memory.peak memory.current memory.high memory.swap.max; do
                if [ -r "$d/$f" ]; then echo "$d/$f = $(cat "$d/$f")"; fi
              done
              d=$(dirname "$d")
            done
          done
          echo "--- cgroup v1 memory (fallback) ---"
          for f in memory.limit_in_bytes memory.max_usage_in_bytes memory.usage_in_bytes; do
            [ -r "/sys/fs/cgroup/memory/$f" ] && echo "/sys/fs/cgroup/memory/$f = $(cat "/sys/fs/cgroup/memory/$f")" || true
          done
          echo "--- cache sizes ---"
          du -sh target 2>/dev/null || true
          echo "===== DIAG post-test END ====="

      - name: Doctests (nextest does not run them)
        # nextest runs libtest binaries only; rustdoc compiles doctests separately.
        # Without this step the executable doc examples silently stop being tested.
        # It runs only when the suite above is GREEN (GitHub's default `success()`
        # condition) — a red suite skips it. "Run separately" in this file's header
        # means "not inside nextest", never "unconditionally".
        timeout-minutes: 15
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          # $GITHUB_ENV from the resolve step (one resolution per job).
          CARGO_PROFILE_CI_STRIP: "false"
          CARGO_BUILD_JOBS: "3"
        run: |
          cargo test --locked --profile ci \
            --no-default-features --features "$FEATURES" --doc

      # NO JUNIT UPLOAD (deleted 2026-11-22): nothing ever downloaded it — 157
      # artifacts on record, zero download-artifact steps in the repo, zero
      # box-side references. Failure output is not lost: the nextest step tees
      # the full `--verbose` run to the step log, which is where it was read.
