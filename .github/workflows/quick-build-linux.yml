name: Quick Linux Build

# Super-quick Linux amd64 binary, on demand. Feature set is a
# dispatch parameter (`features`, default `telegram,code-graph`) — the single
# source of truth for what we ship lives in THIS file's default,
# not in any skill doc. Comma-separated sets are valid, e.g.
# "telegram,browser". No tests, no matrix, no multi-platform.
#
# v0.4.17 SPEED: builds use the tree's own [profile.ci] (thin LTO,
# 16 codegen-units — wall-clock-tuned, ships in upstream Cargo.toml).
# Fat-LTO [profile.release] stays reserved for real release artifacts.
#
# v0.4.28 PHASE 1 (target-process-20260827.md, step 5): a gates job runs the
# 4 ORDER gates BEFORE the build; build `needs: gates` — RED gates =
# no artifact (step 6, fail fast). All-features TESTS run on the PR gate
# (pr-checks.yml, fidelity-mirrored) — carrier gates are pure git
# verification, seconds not minutes (owner 2026-08-31: de-duplicate).
#
# v0.4.28+: the checkout step pins whatever the DISPATCH says
# (source_repository x source_ref — default upstream main; ship dispatches
# send the fork repo + an ordered full sha). ORDER gates 1-3 validate the
# dispatch input itself, so a stale or hostile ref fails loudly instead of
# compiling silently.
#
# CARRIER LANE SPLIT (owner-approved 2026-09-21): this file is now a THIN SHELL.
# The `gates` and `build` job bodies moved to ci-lane-impl.yml (`on:
# workflow_call`) because this file and pr-checks.yml carried ~90% of the same
# gate body and the two had begun to drift. This shell keeps ONLY its name, its
# workflow_dispatch trigger, its three inputs, its env block and its
# concurrency group — plus one caller job that maps them into the shared body.
#
# DISPATCH FORM IS UNCHANGED. The `--ref` remains MANDATORY: workflow_dispatch
# requires the workflow file on the default branch, and this file is not on
# `main`, so the documented `--ref` escape applies to every dispatch of it:
#   gh workflow run quick-build-linux.yml --ref ci/quick-build-linux \
#     -f source_ref=<FULL-40-hex-sha> -f features=<comma-set>
# A bare `gh workflow run quick-build-linux.yml` is NOT a supported form and
# must not be introduced into any tool or doc.
#
# Revert = restore the job bodies from git history into this file.

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repository to check out (owner/name)'
        required: false
        default: 'adolfousier/opencrabs'
      source_ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        default: 'main'
      features:
        description: 'Cargo feature set passed to --features (comma-separated)'
        required: false
        default: 'telegram,code-graph,browser'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quick-build-linux
  cancel-in-progress: false

jobs:
  # Thin caller — the ORDER gates and the build body live in ci-lane-impl.yml.
  # `name:` is pinned to the short token `ship` (NOT the old `ORDER gates (...)`
  # expression) for the same first-decodable-match reason as the PR shell.
  ship:
    name: ship
    uses: ./.github/workflows/ci-lane-impl.yml
    with:
      mode: build
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
      features: ${{ inputs.features }}
