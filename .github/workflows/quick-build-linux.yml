name: Quick Linux Build

# Super-quick Linux amd64 binary, on demand. Feature set is a
# dispatch parameter (`features`, default `telegram`) — the single
# source of truth for what we ship lives in THIS file's default,
# not in any skill doc. Comma-separated sets are valid, e.g.
# "telegram,browser". No tests, no matrix, no multi-platform.
#
# v0.4.17 SPEED: builds use the tree's own [profile.ci] (thin LTO,
# 16 codegen-units — wall-clock-tuned, ships in upstream Cargo.toml).
# Fat-LTO [profile.release] stays reserved for real release artifacts.
#
# Sync-from-origin-first: the checkout step pins the UPSTREAM repo
# (main), so every dispatch compiles adolfousier/opencrabs main tip
# — never a stale fork branch.

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repository to check out (owner/name)'
        required: false
        default: 'adolfousier/opencrabs'
      source_ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        default: 'main'
      features:
        description: 'Cargo feature set passed to --features (comma-separated)'
        required: false
        default: 'telegram'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quick-build-linux
  cancel-in-progress: false

jobs:
  build:
    name: Linux amd64 (${{ inputs.source_ref }}, ${{ inputs.features }})
    runs-on: ubuntu-latest
    steps:
      - name: Sync from origin
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}

      - name: Install system deps (alsa for local-stt/local-tts)
        run: sudo apt-get update -y && sudo apt-get install -y pkg-config libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build ([profile.ci], no tests)
        run: cargo build --locked --profile ci --no-default-features --features "${{ inputs.features }}"

      - name: Strip
        run: strip target/ci/opencrabs

      # Provenance rider (v0.4.17): what produced this binary travels with
      # it — the IDENTITY chain records flags, not just shas.
      - name: Record build provenance
        run: |
          {
            echo "source_repository=${{ inputs.source_repository }}"
            echo "source_ref=${{ inputs.source_ref }}"
            echo "features=${{ inputs.features }}"
            echo "cargo_profile=ci"
            echo "lto=thin codegen_units=16"
            rustc -vV | grep -E '^(host|release):'
          } > build-flags.txt

      # Binary filename stays `opencrabs-linux-amd64` (swap scripts
      # depend on it); only the ARTIFACT name carries the set.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-linux-amd64-${{ inputs.features }}
          path: |
            target/ci/opencrabs
            build-flags.txt
          if-no-files-found: error
