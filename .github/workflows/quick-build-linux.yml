name: Quick Linux Build

# Super-quick Linux amd64 binary, on demand. Minimal feature set:
# telegram only — skips every heavy dep (whisper.cpp,
# rodio/ALSA, serenity, slack-morphism, whatsapp-rust, pdfium,
# profiling, eval). No tests, no matrix, no multi-platform.
#
# Sync-from-origin-first: the checkout step pins the UPSTREAM repo
# (main), so every dispatch compiles adolfousier/opencrabs main tip
# — never a stale fork branch.

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repository to check out (owner/name)'
        required: false
        default: 'adolfousier/opencrabs'
      source_ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        default: 'main'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Linux amd64 (${{ inputs.source_ref }}, minimal features)
    runs-on: ubuntu-latest
    steps:
      - name: Sync from origin
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (release, minimal features, no tests)
        run: cargo build --locked --release --no-default-features --features "telegram,browser,rtk"

      - name: Strip
        run: strip target/release/opencrabs

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-linux-amd64
          path: target/release/opencrabs
          if-no-files-found: error
