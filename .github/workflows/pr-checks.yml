name: PR-lane gates

# PR-lane gates — the pre-upstream-PR checks of the deploy-model ontology
# (v0.4.22 fmt/clippy CONTRIBUTING.md compliance + v0.4.23 all-features test).
#
# Why this workflow exists: PR-head branches (leshchenko1979/<slug>) are
# harvested off adolfousier/main, so they never pass fork main — the carrier
# gates job never sees them — and upstream's own full gate only fires AFTER
# the PR opens. This box cannot run cargo, so this dispatch-triggered workflow
# is the only place the PR-lane gates can run BEFORE the PR exists.
#
# Invocation (carrier-law shape, mirrors quick-build-linux.yml):
#   gh workflow run pr-checks.yml --ref ci/quick-build-linux -f ref=<branch-or-sha>
# Fix mode (fmt sweep helper, owner-approved 2026-08-27):
#   gh workflow run pr-checks.yml --ref ci/quick-build-linux -f ref=<branch-or-sha> -f fix=true
# runs `cargo fmt --all` with the exact gate toolchain and uploads the
# resulting diff as the `fmt-fix` artifact — apply the sweep locally, no
# cargo needed on the box. Fix mode skips the gate steps; the fidelity rule
# below covers check mode only.
# Lock-regen mode (compiler, 2026-08-28; owner-GO'd resvg-stack item 00:57Z,
# mechanism per the fix-mode precedent above):
#   gh workflow run pr-checks.yml --ref ci/quick-build-linux -f ref=<branch-with-Cargo.toml-edit> -f lockregen=true
# runs `cargo metadata` with the EXISTING Cargo.lock present — a MINIMAL
# re-resolve: every surviving package keeps its locked version, packages made
# unreachable by the Cargo.toml edit are pruned, zero semver churn
# (generate-lockfile / bare update would bump; deliberately not used) — and
# uploads the regenerated lock as the `regen-lock` artifact for box-side
# application (box law 2026-08-28: no cargo on the box). Lock-regen mode
# skips the gate steps. Revert = delete the lockregen input + its steps.
# Swap mode (owner 2026-09-03, fleet-directives 'Swap-head signature for
# merge-derived binaries'):
#   gh workflow run pr-checks.yml --ref ci/quick-build-linux -f ref=<swap-head-sha> -f swap=true
# mirrors build-leg ORDER gate 4 (Session-Id trailer) on the gated ref
# BEFORE the gates — a swap-mode GREEN means the head is swappable: the
# quick-build leg has no remaining semantic failure mode (clippy+tests
# subsume build success; the binary build itself stays quick-build's job,
# no duplicate artifact per the 2026-08-31 de-dup ruling). Ordinary runs
# are unchanged (input-gated). 2026-09-03 finding this prevents: bare
# merge d02f4e08 passed this lane GREEN and died at the build leg.
# The workflow yaml is read from this carrier branch (workflow_dispatch needs
# the file on the dispatched ref); the job then checks out `inputs.ref`.
# Keeping the yml here means PR-head branches carry zero infra commits into
# Adolfo's diff, and fork main stays clean of workflow files (2026-08-26 law).
#
# Fidelity rule: every cargo invocation below mirrors adolfousier/opencrabs
# .github/workflows/ci.yml EXACTLY, so a green run here predicts a green
# upstream full gate on the same ref. Do not drift.
#
# The green run URL is the v0.4.22 citation for the PR body.
# Revert = delete this file.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or full sha to gate (the PR-head branch, e.g. leshchenko1979/<slug>)"
        required: false
        default: main
        type: string
      fix:
        description: "true = run cargo fmt --all and upload the diff as the fmt-fix artifact instead of gating"
        required: false
        default: false
        type: boolean
      lockregen:
        description: "true = cargo metadata minimal re-resolve with the existing Cargo.lock; uploads the regenerated lock as the regen-lock artifact instead of gating"
        required: false
        default: false
        type: boolean
      swap:
        description: "true = swap prep: mirror build-leg gate 4 (Session-Id trailer) on the gated ref before the gates; swap-mode GREEN means swappable"
        required: false
        default: false
        type: boolean
      fast:
        description: "true = fast gate (fmt + clippy only, skip tests); for quick syntax and lint checks"
        required: false
        default: false
        type: boolean
      no_cancel:
        description: "true = never cancel an in-flight run on this ref (immutable-sha gates: merge cutover + swap mode)"
        required: false
        default: false
        type: boolean
      diagnose:
        description: "true = print the runner's real resource envelope (cpu/ram/disk/cgroup/sccache) around the test leg; diagnostic only, never fails the run"
        required: false
        default: false
        type: boolean

# Owner GO 2026-09-18 01:2xZ (diagnose variable, CI-143 investigation): the
# 2026-09-17 SIGTERM storm (16/17 `Run tests` runs, exit 143, post-steps
# skipped => runner teardown) was resolved by removing RUSTC_WRAPPER=sccache
# from THIS leg, but the ENVELOPE it exhausted was never measured — H3 (cgroup
# memory ceiling) and H4 (thin-LTO link memory cliff) were argued against the
# published 16 GB / 4 vCPU spec, not against a reading. `diagnose=true` prints
# nproc, free -m, df -h, cgroup v2 memory.max/current/peak (v1 fallback),
# cache sizes and `sccache --show-stats` BOTH before and after the test leg,
# so a future kill can be attributed from the run's own log. Default false =>
# every existing caller is byte-for-byte unchanged in behavior. Diagnostics are
# `|| true`-guarded: a probe that fails the gate it is measuring is worthless.
#
# Owner-approved 2026-08-30 (fix batch, a87b66dc; group KEY corrected same
# day, owner "Fix it" 02:32Z on the cancel-storm finding): every
# workflow_dispatch lands on this carrier branch, so github.ref_name is
# CONSTANT across lanes — the original ref_name key put ALL lanes into one
# kill-group and each new dispatch cancelled the previous lane's gate
# (08-30 22:06-23:20Z: 4 runs mutually cancelled, no gate could finish while
# two lanes dispatched within the same window). The group now keys on
# inputs.ref — the branch-or-sha each dispatch passes (oc-prchecks sends the
# gated ref) — so distinct refs run in PARALLEL and only a re-dispatch of the
# SAME ref (head moved) cancels its superseded run. cancel-in-progress keeps
# that owner-mandated supersede behavior per-ref.
#
# Owner GO 2026-09-17 22:59Z (no_cancel variable): the group key is the gated
# ref, which makes the supersede rule correct for a PR-lane BRANCH (the head
# moved, so the old verdict is worthless) but WRONG for an IMMUTABLE 40-hex sha
# (merge/sync cutover, swap mode) — there a same-ref re-dispatch is a DUPLICATE,
# not a supersede, and cancelling it SIGTERMs an in-flight cargo test suite
# (receipt: run 35279942039, Run tests step conclusion "cancelled", our own
# same-sha re-dispatch of 48c6f14bb). So the supersede is now a VARIABLE:
# oc-prchecks passes -f no_cancel=true when the resolved ref is a full sha.
# Default false => every existing caller is byte-for-byte unchanged in behavior.
# A second workflow was rejected: it would duplicate the whole gate body and
# fork the triad flags that editor-upstream-pr.md §PR-GATE-STANDING pins
# VERBATIM to this one file.
concurrency:
  group: prchecks-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: ${{ !inputs.no_cancel }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # Thin caller — the gate body lives in ci-lane-impl.yml. `name:` is pinned to
  # the short token `gate` (NOT the old PR-lane expression): under workflow_call
  # every job renders "<caller> / <called>", and `run_built_sha` takes the FIRST
  # .jobs[].name that decodes to a 40-hex sha — a caller name carrying a run sha
  # would shadow the real job name. See the file header for the full reasoning.
  gate:
    name: gate
    uses: ./.github/workflows/ci-lane-impl.yml
    with:
      mode: gate
      ref: ${{ inputs.ref || github.ref_name }}
      fix: ${{ inputs.fix }}
      lockregen: ${{ inputs.lockregen }}
      swap: ${{ inputs.swap }}
      fast: ${{ inputs.fast }}
      diagnose: ${{ inputs.diagnose }}
