name: PR-lane gates

# PR-lane gates — the pre-merge gate for a PR-head branch: fmt, clippy over
# `--all-features`, nextest over the SHIPPED feature set, then doctests.
#
# WHY IT EXISTS: a PR-head branch has not passed fork main, so the carrier gates
# job never sees it, and this box cannot run cargo. This dispatch-triggered
# workflow is the only place the gates can run BEFORE the branch merges.
#
# INVOCATION (the `--ref` is mandatory — this file is not on `main`):
#   plain gate  gh workflow run pr-checks.yml --ref ci/quick-build-linux -f ref=<branch-or-sha>
#   fix         ... -f fix=true         -> `fmt-fix` artifact (cargo fmt --all diff); gate steps skipped
#   lockregen   ... -f lockregen=true   -> `regen-lock` artifact (cargo metadata minimal re-resolve:
#                                          survivors keep their locked version, zero semver churn)
#   lockupdate  ... -f lockupdate=true  -> `updated-lock` artifact (real `cargo update`; requirements untouched)
#   lock_pins   ... -f lockupdate=true -f lock_pins='pkg@ver ...'  holds named crates back after the update
#                                          (prerelease-caret trap: ^2.0.0-rc0 admits the release)
#   swap        ... -f swap=true        -> mirrors build-leg gate 4 (Session-Id trailer) BEFORE the gates
#   fast        ... -f fast=true        -> fmt + clippy only, no tests
#   diagnose    ... -f diagnose=true    -> resource envelope before AND after the test leg; both reads are
#                                          required (a pre-only memory.peak describes whatever ran earlier)
#   no_cancel   ... -f no_cancel=true   -> never supersede an in-flight run on this ref (immutable 40-hex shas:
#                                          a same-sha re-dispatch is a DUPLICATE, and cancelling it SIGTERMs a
#                                          live suite — receipt run 35279942039)
#
# EVERY MODE ABOVE IS LIVE, MEASURED (2026-11-22, over the 3001 pr-checks runs on record since 2026-08-27):
# fix 8, lockregen 2, lockupdate 3, swap 12, fast 265, diagnose 298 (runs whose probe step actually executed).
# The three lock/fix counts are corroborated independently by their artifact inventory (8 fmt-fix, 2 regen-lock,
# 3 updated-lock). NONE of them is zero-invocation: do not delete one on that claim without re-running the count.
#
# CONCURRENCY keys on inputs.ref, not github.ref_name: every dispatch lands on THIS carrier branch, so a
# ref_name key put all lanes in one kill-group and each new dispatch cancelled the previous lane's gate
# (2026-08-30, 22:06-23:20Z: 4 runs mutually cancelled, no gate could finish). cancel-in-progress is a
# VARIABLE because supersede is right for a branch (head moved => old verdict worthless) and wrong for an
# immutable sha (=> duplicate). Default false keeps every existing caller byte-for-byte unchanged.
#
# `test_threads` / `hangdump` are RETIRED (2026-11-20 — the libtest leg they configured is gone) and read by
# nothing. They stay DECLARED, and are relayed NOWHERE, because a removed workflow_dispatch input is a hard
# 422 for every caller that still passes it: `oc-prchecks --test-threads 2` was passed on 63 of the 240
# dispatches 2026-11-19..22 (latest run 44957812717) and `-f hangdump=true` on 4 (latest run 44738529406).
# The no-op is load-bearing exactly at the dispatch boundary, which is why the declaration lives here and not
# in ci-lane-impl.yml (deleted there 2026-11-22 — 0 references).
#
# THE BODY IS NOT HERE: it lives in ci-lane-impl.yml (`workflow_call`); this file keeps the trigger, the
# inputs and the concurrency group. The caller job's `name:` is pinned to the short token `gate` (not an
# expression): under workflow_call every job renders "<caller> / <called>", and run_built_sha takes the FIRST
# .jobs[].name that decodes to a 40-hex sha — a caller name carrying a run sha would shadow the real job name.
#
# NO UPSTREAM-PARITY RULE (owner order 2026-11-20: "we are a standalone telegram-oriented fork"). These gates
# are sized against THIS fork's tree and its own history. They mirror no upstream workflow, a green run here
# predicts nothing about another repo, and nothing here should be "corrected" to match one.
#
# Revert = delete this file.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or full sha to gate (the PR-head branch, e.g. leshchenko1979/<slug>)"
        required: false
        default: main
        type: string
      fix:
        description: "true = run cargo fmt --all and upload the diff as the fmt-fix artifact instead of gating"
        required: false
        default: false
        type: boolean
      lockregen:
        description: "true = cargo metadata minimal re-resolve with the existing Cargo.lock; uploads the regenerated lock as the regen-lock artifact instead of gating"
        required: false
        default: false
        type: boolean
      lockupdate:
        description: "true = cargo update (newest semver-compatible for every package) with the existing Cargo.lock; uploads the updated lock as the updated-lock artifact instead of gating"
        required: false
        default: false
        type: boolean
      lock_pins:
        description: "lockupdate only: space-separated pkg@version pins applied AFTER cargo update (e.g. 'glass_pumpkin@2.0.0-rc0')"
        required: false
        default: ""
        type: string
      swap:
        description: "true = swap prep: mirror build-leg gate 4 (Session-Id trailer) on the gated ref before the gates; swap-mode GREEN means swappable"
        required: false
        default: false
        type: boolean
      fast:
        description: "true = fast gate (fmt + clippy only, skip tests); for quick syntax and lint checks"
        required: false
        default: false
        type: boolean
      no_cancel:
        description: "true = never cancel an in-flight run on this ref (immutable-sha gates: merge cutover + swap mode)"
        required: false
        default: false
        type: boolean
      diagnose:
        description: "true = print the runner's real resource envelope (cpu/ram/disk/cgroup) TWICE in pr-gates-nextest: immediately before the test leg and again after it. Both reads are required — memory.peak taken before compilation is the peak of whatever ran earlier in that cgroup, so a pre-only probe cannot show what the compile-and-test leg actually reached. Diagnostic only, never fails the run."
        required: false
        default: false
        type: boolean
      # RETIRED 2026-11-20 (the legacy `cargo test` leg they configured is
      # deleted; `pr-gates-nextest` is the verdict). READ BY NOTHING and relayed
      # to nothing — the callee's declarations of both were deleted 2026-11-22.
      # They stay declared HERE because this is the surface a dispatch names: a
      # removed workflow_dispatch input is a hard 422 for every caller that
      # still passes it, and callers still do — `test_threads` on 63 of the 240
      # dispatches 2026-11-19..22 (latest run 44957812717), `hangdump=true` on 4
      # (latest run 44738529406). An accepted no-op, not dead config.
      test_threads:
        description: "RETIRED 2026-11-20 (the libtest leg it configured is deleted; nextest is the verdict). Accepted and IGNORED — read by nothing. Kept declared so `oc-prchecks --test-threads N` keeps dispatching instead of erroring."
        required: false
        default: ""
        type: string
      hangdump:
        description: "RETIRED 2026-11-20 (the test leg it instrumented is deleted). Accepted and IGNORED — read by nothing. Kept declared so existing dispatches keep working."
        required: false
        default: false
        type: boolean

# DIAGNOSE DEFAULT IS `false` (reverted 2026-11-16 after the 2026-10-03..11-16
# armed monitoring window). The window did its job: the envelope WAS captured on
# the single teardown in 295 dispatches — run 38793394953 (2026-10-15T19:22:40Z,
# carrier c350d66c), `/system.slice` memory.peak 15.16 GiB = 97.1% of MemTotal,
# memory.max = `max` at both levels (so the cgroup-ceiling hypothesis is
# refuted), killed during compilation with ZERO tests run. A future capture
# passes `-f diagnose=true` explicitly; the mechanism question stays OPEN on
# #311 (issuecomment-5974242671, issuecomment-6912072844). Every probe in the
# step is `|| true`: a measurement that can fail the gate it measures is worthless.
#
# A second workflow was rejected: it would duplicate the whole gate body and
# fork the cargo flags every dispatch of this lane must carry identically. No
# external document pins them — ci-lane-impl.yml is the authority, and the
# `ci/*` carrier namespace is owned by the HQ lane.
concurrency:
  group: prchecks-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: ${{ !inputs.no_cancel }}

permissions:
  contents: read

jobs:
  # Thin caller — the gate body lives in ci-lane-impl.yml. `name:` is pinned to
  # the short token `gate` (NOT the old PR-lane expression): under workflow_call
  # every job renders "<caller> / <called>", and `run_built_sha` takes the FIRST
  # .jobs[].name that decodes to a 40-hex sha — a caller name carrying a run sha
  # would shadow the real job name. See the file header for the full reasoning.
  gate:
    name: gate
    uses: ./.github/workflows/ci-lane-impl.yml
    with:
      mode: gate
      ref: ${{ inputs.ref || github.ref_name }}
      fix: ${{ inputs.fix }}
      lockregen: ${{ inputs.lockregen }}
      lockupdate: ${{ inputs.lockupdate }}
      lock_pins: ${{ inputs.lock_pins }}
      swap: ${{ inputs.swap }}
      fast: ${{ inputs.fast }}
      diagnose: ${{ inputs.diagnose }}
      # NO test_threads / hangdump relay (deleted 2026-11-22): the callee has no
      # such inputs and nothing read them. They stay declared on THIS file only,
      # as the dispatch-surface no-op described in the header.
      # `features` is deliberately NOT passed: the gate resolves the shipped set
      # from quick-build-linux.yml, its single source of truth.
