name: PR-lane gates

# PR-lane gates — the pre-upstream-PR checks of the deploy-model ontology
# (v0.4.22 fmt/clippy CONTRIBUTING.md compliance + v0.4.23 all-features test).
#
# Why this workflow exists: PR-head branches (leshchenko1979/<slug>) are
# harvested off adolfousier/main, so they never pass fork main — the carrier
# gates job never sees them — and upstream's own full gate only fires AFTER
# the PR opens. This box cannot run cargo, so this dispatch-triggered workflow
# is the only place the PR-lane gates can run BEFORE the PR exists.
#
# Invocation (carrier-law shape, mirrors quick-build-linux.yml):
#   gh workflow run pr-checks.yml --ref ci/quick-build-linux -f ref=<branch-or-sha>
# Fix mode (fmt sweep helper, owner-approved 2026-08-27):
#   gh workflow run pr-checks.yml --ref ci/quick-build-linux -f ref=<branch-or-sha> -f fix=true
# runs `cargo fmt --all` with the exact gate toolchain and uploads the
# resulting diff as the `fmt-fix` artifact — apply the sweep locally, no
# cargo needed on the box. Fix mode skips the gate steps; the fidelity rule
# below covers check mode only.
# Lock-regen mode (compiler, 2026-08-28; owner-GO'd resvg-stack item 00:57Z,
# mechanism per the fix-mode precedent above):
#   gh workflow run pr-checks.yml --ref ci/quick-build-linux -f ref=<branch-with-Cargo.toml-edit> -f lockregen=true
# runs `cargo metadata` with the EXISTING Cargo.lock present — a MINIMAL
# re-resolve: every surviving package keeps its locked version, packages made
# unreachable by the Cargo.toml edit are pruned, zero semver churn
# (generate-lockfile / bare update would bump; deliberately not used) — and
# uploads the regenerated lock as the `regen-lock` artifact for box-side
# application (box law 2026-08-28: no cargo on the box). Lock-regen mode
# skips the gate steps. Revert = delete the lockregen input + its steps.
# The workflow yaml is read from this carrier branch (workflow_dispatch needs
# the file on the dispatched ref); the job then checks out `inputs.ref`.
# Keeping the yml here means PR-head branches carry zero infra commits into
# Adolfo's diff, and fork main stays clean of workflow files (2026-08-26 law).
#
# Fidelity rule: every cargo invocation below mirrors adolfousier/opencrabs
# .github/workflows/ci.yml EXACTLY, so a green run here predicts a green
# upstream full gate on the same ref. Do not drift.
#
# The green run URL is the v0.4.22 citation for the PR body.
# Revert = delete this file.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or full sha to gate (the PR-head branch, e.g. leshchenko1979/<slug>)"
        required: false
        default: main
        type: string
      fix:
        description: "true = run cargo fmt --all and upload the diff as the fmt-fix artifact instead of gating"
        required: false
        default: false
        type: boolean
      lockregen:
        description: "true = cargo metadata minimal re-resolve with the existing Cargo.lock; uploads the regenerated lock as the regen-lock artifact instead of gating"
        required: false
        default: false
        type: boolean

# Owner-approved 2026-08-30 (fix batch, a87b66dc; group KEY corrected same
# day, owner "Fix it" 02:32Z on the cancel-storm finding): every
# workflow_dispatch lands on this carrier branch, so github.ref_name is
# CONSTANT across lanes — the original ref_name key put ALL lanes into one
# kill-group and each new dispatch cancelled the previous lane's gate
# (08-30 22:06-23:20Z: 4 runs mutually cancelled, no gate could finish while
# two lanes dispatched within the same window). The group now keys on
# inputs.ref — the branch-or-sha each dispatch passes (oc-prchecks sends the
# gated ref) — so distinct refs run in PARALLEL and only a re-dispatch of the
# SAME ref (head moved) cancels its superseded run. cancel-in-progress keeps
# that owner-mandated supersede behavior per-ref.
concurrency:
  group: prchecks-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  gates:
    name: PR-lane gates (${{ inputs.ref }}${{ inputs.fix && ' — FIX MODE' || inputs.lockregen && ' — LOCK REGEN' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: true # pre-PR branches re-run on fix-forward; warm cache turns the second dispatch into minutes

      - name: Install pkg-config + ALSA dev
        if: ${{ !inputs.fix && !inputs.lockregen }}
        # Mirrors upstream ci.yml's libasound2-dev (local-stt/cpal) plus the
        # pkg-config that alsa-sys needs to compile at all (carrier lesson,
        # 378a68a8).
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libasound2-dev

      - name: Check formatting
        if: ${{ !inputs.fix && !inputs.lockregen }}
        # Soft-fail, mirroring upstream ci.yml verbatim: "legacy un-formatted
        # code blocks shouldn't block PRs yet. Promote to hard-fail once a fmt
        # sweep lands on main." When upstream promotes it, so do we — not before.
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ !inputs.fix && !inputs.lockregen }}
        run: cargo clippy --locked --lib --bins --tests --all-features -- -D warnings

      - name: Install mold + clang (test link speed)
        if: ${{ !inputs.fix && !inputs.lockregen }}
        run: sudo apt-get install -y mold clang

      - name: Run tests
        if: ${{ !inputs.fix && !inputs.lockregen }}
        # v0.4.23 law: the all-features test gate. Flags mirror upstream's
        # `test` job exactly (profile ci + mold linker).
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo test --locked --profile ci --all-features --verbose

      - name: Apply cargo fmt (fix mode)
        if: ${{ inputs.fix }}
        run: |
          cargo fmt --all
          git diff > fmt-fix.patch
          git diff --stat | tee fmt-fix.stat
          echo "ref=${{ inputs.ref }}" > fmt-fix.meta
          echo "patch_bytes=$(wc -c < fmt-fix.patch)" >> fmt-fix.meta

      - name: Upload fmt-fix patch
        if: ${{ inputs.fix }}
        uses: actions/upload-artifact@v4
        with:
          name: fmt-fix
          path: |
            fmt-fix.patch
            fmt-fix.stat
            fmt-fix.meta
          if-no-files-found: error

      - name: "Guard: existing Cargo.lock present (lock-regen mode)"
        if: ${{ inputs.lockregen }}
        # Minimal re-resolve REQUIRES the existing lock: cargo metadata with
        # no lock does a full re-resolve (the semver churn we're avoiding).
        # Fail loudly instead of churning.
        run: test -f Cargo.lock

      - name: Minimal lock re-resolve (lock-regen mode)
        if: ${{ inputs.lockregen }}
        run: |
          cargo metadata --format-version=1 > /dev/null
          echo "=== lock delta ==="
          git diff --stat Cargo.lock
          git diff Cargo.lock | head -300

      - name: Upload regen-lock (lock-regen mode)
        if: ${{ inputs.lockregen }}
        uses: actions/upload-artifact@v4
        with:
          name: regen-lock
          path: Cargo.lock
          if-no-files-found: error
